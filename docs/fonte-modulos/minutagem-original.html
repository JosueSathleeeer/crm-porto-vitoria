<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Porto Vitória · Sistema de Minutagem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700&family=Barlow:wght@400;500;600;700&family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --g900:#062a17; --g800:#0a3a20; --g700:#0e4a29; --g600:#146b39; --g500:#1b8a4a; --g400:#3fae68; --g300:#7bd08f;
  --gold:#f2b81b;
  --bg:#eef2ef; --card:#ffffff; --card2:#f6f8f7; --line:#dfe6e2; --ink:#14201a; --ink2:#4b5a52; --ink3:#7d8b84;
  --row:#f7faf8; --shadow:0 1px 2px rgba(10,40,25,.08),0 4px 14px rgba(10,40,25,.06);
  --red:#e0342b; --yellow:#f6c21c; --orange:#f39324; --blue:#2f6fd6; --purple:#7a3fd1; --pink:#ec3f93; --teal:#159aa8;
  --fc:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --fb:'Barlow','Segoe UI',Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1410; --card:#141e19; --card2:#1a2620; --line:#26352d; --ink:#e7efe9; --ink2:#a9b8af; --ink3:#7f9087; --row:#17221c;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0c1410; --card:#141e19; --card2:#1a2620; --line:#26352d; --ink:#e7efe9; --ink2:#a9b8af; --ink3:#7f9087; --row:#17221c;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:14px;-webkit-font-smoothing:antialiased}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- App shell ---------- */
.app{display:flex;height:100%}
.side{width:68px;flex:0 0 68px;background:linear-gradient(180deg,var(--g800),var(--g900));display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;position:relative;z-index:30}
.side .brand{width:46px;height:46px;margin-bottom:14px}
.side .brand img{width:100%;height:100%;object-fit:contain}
.nav-item{position:relative;width:100%;display:flex;justify-content:center}
.nav-btn{width:46px;height:46px;border-radius:12px;border:0;background:transparent;color:#cfe6d6;display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s}
.nav-btn svg{width:22px;height:22px}
.nav-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-btn.active{background:var(--g500);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav-fly{position:absolute;left:58px;top:0;background:var(--g800);color:#fff;border-radius:10px;padding:6px;min-width:170px;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;visibility:hidden;transform:translateX(-6px);transition:opacity .12s,transform .12s,visibility .12s}
.nav-fly::before{content:"";position:absolute;left:-14px;top:0;width:14px;height:100%}
.nav-item:hover .nav-fly,.nav-item:focus-within .nav-fly{opacity:1;visibility:visible;transform:none}
.nav-fly .fly-title{font-family:var(--fc);font-weight:700;font-size:15px;letter-spacing:.3px;padding:6px 10px 4px;color:var(--gold);text-transform:uppercase}
.nav-fly button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;color:#e6f2ea;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13.5px}
.nav-fly button:hover{background:rgba(255,255,255,.1)}
.nav-fly button.active{background:var(--g500)}
.side .spacer{flex:1}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar .crumb{font-family:var(--fc);font-weight:700;font-size:19px;color:var(--ink);margin-right:auto;text-transform:uppercase;letter-spacing:.3px}
.topbar .crumb small{font-weight:600;color:var(--ink3);font-size:15px}
.flt{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:4px 4px 4px 10px}
.flt label{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.4px}
.flt select{border:0;background:transparent;font-weight:600;padding:5px 4px;cursor:pointer;max-width:170px}
.flt select option{color:#111;background:#fff}
.sync{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:#aaa;display:inline-block}
.sync.ok i{background:var(--g400)}
.content{flex:1;overflow:auto;padding:16px 18px 30px}

.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:9px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--g400)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--g600);border-color:var(--g600);color:#fff}
.btn.pri:hover{background:var(--g500)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1d1a05}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn svg{width:16px;height:16px}
.icon-btn{border:0;background:transparent;cursor:pointer;padding:6px;border-radius:7px;color:var(--ink2)}
.icon-btn:hover{background:var(--card2);color:var(--ink)}
.icon-btn svg{width:17px;height:17px}

/* ---------- Report (dashboards) ---------- */
.report{max-width:1560px;margin:0 auto;background:var(--bg)}
.rhead{position:relative;display:flex;align-items:center;gap:18px;background:linear-gradient(100deg,var(--g800) 0%,var(--g700) 45%,#0c3f23 100%);color:#fff;border-radius:12px 12px 0 0;padding:14px 22px;min-height:104px;overflow:hidden}
.rhead::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 9px);pointer-events:none}
.rhead .logo{width:78px;height:84px;flex:0 0 auto;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.rhead .t1{font-family:var(--fc);font-weight:800;font-size:38px;line-height:1;letter-spacing:.3px}
.rhead .t2{font-family:var(--fc);font-weight:700;font-size:19px;line-height:1.15;margin-top:4px}
.rhead .t3{font-family:var(--fc);font-weight:500;font-size:17px;letter-spacing:.4px;line-height:1.2;opacity:.95}
.rhead .center{flex:1;text-align:center;position:relative;z-index:1}
.rhead .bigtitle{font-family:var(--fc);font-weight:800;font-size:clamp(28px,3vw,46px);line-height:1;letter-spacing:.5px;white-space:nowrap}
.rhead .pill{display:inline-block;background:var(--g500);border-radius:8px;padding:2px 14px;font-family:var(--fc);font-weight:800;font-size:20px;margin-top:5px}
.rhead .subcat{font-family:var(--fc);font-weight:800;font-size:30px;line-height:1;margin-top:3px}
.rhead .meta{display:flex;align-items:center;background:#fff;color:var(--g900);border-radius:12px 0 0 12px;margin-right:-22px;padding:10px 18px 10px 26px;clip-path:polygon(22px 0,100% 0,100% 100%,0 100%);position:relative;z-index:1}
.rhead .meta .mi{display:flex;align-items:center;gap:9px;padding:0 16px;border-left:1px solid #d3ddd7}
.rhead .meta .mi:first-child{border-left:0}
.rhead .meta .mi svg{width:30px;height:30px;color:var(--g800)}
.rhead .meta small{display:block;font-size:10.5px;font-weight:600;color:#3d4d44;text-transform:uppercase}
.rhead .meta b{display:block;font-family:var(--fc);font-weight:800;font-size:19px;line-height:1.05;text-transform:uppercase}
.rhead .slogan{font-family:var(--fc);font-weight:700;font-style:italic;font-size:19px;line-height:1.1;color:var(--g300);text-transform:uppercase;letter-spacing:.6px;padding-left:22px;position:relative;z-index:1}
.rhead .slogan.bar{font-style:normal;font-size:16px;border-left:3px solid var(--g400);padding-left:12px;margin-left:22px}
.rhead > div{position:relative;z-index:1}
.rbody{padding:16px 0 0}

.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;gap:14px;align-items:flex-start;box-shadow:var(--shadow);min-width:0}
.kpi svg{width:44px;height:44px;flex:0 0 44px;color:var(--g800)}
:root[data-theme="dark"] .kpi svg{color:var(--g300)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kpi svg{color:var(--g300)}}
.kpi .k{font-family:var(--fc);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.2px;line-height:1.1}
.kpi .v{font-family:var(--fc);font-weight:800;font-size:31px;line-height:1.05;margin-top:2px}
.kpi .s{color:var(--ink2);font-size:13.5px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.ph{background:linear-gradient(90deg,var(--g800),var(--g700));color:#fff;font-family:var(--fc);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.3px;padding:6px 18px;display:flex;align-items:center;gap:10px}
.ph .r{margin-left:auto;font-size:14px;font-weight:600;opacity:.9}
.pb{padding:14px 18px}
.grid3{display:grid;grid-template-columns:1.25fr 1.05fr .75fr;gap:14px;margin-bottom:16px}

/* distribution bars */
.dist{display:grid;grid-template-columns:auto 1fr auto auto;gap:7px 14px;align-items:center}
.dist .nm{display:flex;align-items:center;gap:10px;font-size:15px}
.dist .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:0 0 20px}
.dist .dot svg{width:12px;height:12px}
.track{height:14px;background:#e9eeeb;border-radius:3px;overflow:hidden}
:root[data-theme="dark"] .track{background:#24322a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .track{background:#24322a}}
.track>i{display:block;height:100%;background:linear-gradient(90deg,var(--g600),var(--g500));border-radius:3px}
.dist .vv{font-family:var(--fc);font-weight:800;font-size:17px;text-align:right}
.dist .pp{color:var(--ink2);font-size:14px;text-align:right;min-width:46px}

/* vertical bar chart */
.vchart{position:relative;height:200px;display:flex}
.vchart .yaxis{display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--ink2);padding:0 8px 22px 0;text-align:right}
.vchart .plot{flex:1;position:relative;border-left:1px solid #9aa79f;border-bottom:1px solid #9aa79f;display:flex;align-items:flex-end;justify-content:space-around;margin-bottom:22px}
.vchart .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.vchart .bar{position:relative;width:62%;max-width:34px;background:linear-gradient(180deg,var(--g500),var(--g700));border-radius:2px 2px 0 0}
.vchart .bar b{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:600;white-space:nowrap}
.vchart .bar small{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--ink2)}
.vchart .col{flex:1;display:flex;justify-content:center;align-items:flex-end;height:100%;position:relative}

/* donut */
.donut-wrap{display:flex;align-items:center;gap:18px;justify-content:center}
.donut{position:relative;flex:0 0 auto}
.donut .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .c b{font-family:var(--fc);font-weight:800;font-size:30px;line-height:1}
.donut .c span{color:var(--ink2);font-size:15px}
.legend{display:flex;flex-direction:column;gap:16px}
.legend .li{display:flex;gap:10px;align-items:flex-start}
.legend .sw{width:16px;height:22px;border-radius:2px;flex:0 0 16px;margin-top:2px}
.legend .sw.round{width:20px;height:20px;border-radius:50%}
.legend b{font-family:var(--fc);font-weight:700;font-size:17px;display:block;line-height:1.1}
.legend span{color:var(--ink2);font-size:15px}

/* position cards (dashboard) */
.poscards{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;padding:12px}
.pc{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.pc .pch{color:#fff;font-family:var(--fc);font-weight:700;font-size:15px;text-transform:uppercase;display:flex;align-items:center;gap:8px;padding:5px 12px;justify-content:center;position:relative}
.pc .pch svg{width:16px;height:16px;position:absolute;left:12px}
.pc .pv{padding:8px 14px 6px;border-bottom:1px solid var(--line)}
.pc .pv b{font-family:var(--fc);font-weight:800;font-size:21px;display:block;line-height:1.1}
.pc .pv span{font-size:12px;color:var(--ink2)}
.pc .ps{display:grid;grid-template-columns:1fr 1fr;padding:6px 0 8px}
.pc .ps>div{padding:0 12px}
.pc .ps>div+div{border-left:1px solid var(--line)}
.pc .ps b{font-family:var(--fc);font-weight:800;font-size:17px;display:block}
.pc .ps span{font-size:11px;color:var(--ink2)}

/* tables */
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.t th{background:var(--g800);color:#fff;font-family:var(--fc);font-weight:700;font-size:14px;text-transform:uppercase;padding:6px 8px;white-space:nowrap;border-right:1px solid rgba(255,255,255,.18)}
table.t th:last-child{border-right:0}
table.t td{padding:4px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;white-space:nowrap}
table.t td:last-child{border-right:0}
table.t tbody tr:nth-child(even) td{background:var(--row)}
table.t td.l{text-align:left}
.tbl-frame{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:12px}
.poscell{color:#13201a;font-weight:500}
.ptag{display:inline-block;min-width:38px;padding:2px 6px;border-radius:3px;color:#fff;font-weight:700;font-family:var(--fc);font-size:13px;letter-spacing:.3px;text-align:center}
.ava{width:24px;height:24px;border-radius:4px;object-fit:cover;object-position:center top;vertical-align:middle;background:#2a302d}
.ava.round{border-radius:50%}
.athcell{display:flex;align-items:center;gap:10px}
.mbar{display:flex;align-items:center;gap:6px}
.mbar .track{flex:1;height:14px;min-width:70px;border-radius:2px}
.mbar .track i{border-radius:2px}

.rfoot{display:flex;align-items:center;gap:16px;padding:16px 4px 4px;color:var(--ink2);font-size:12px}
.rfoot img{width:40px;height:44px;object-fit:contain}
.rfoot .club b{display:block;font-family:var(--fc);font-weight:700;font-size:16px;color:var(--ink)}
.rfoot .club span{font-family:var(--fc);font-size:14px;color:var(--ink)}
.rfoot .mid{flex:1;display:flex;align-items:center;gap:14px;justify-content:center}
.rfoot .mid hr{flex:1;border:0;border-top:1px solid var(--ink3);opacity:.6}
.rfoot .leg{flex:1;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:12px;color:var(--ink)}
.rfoot .leg .sq{display:inline-block;width:13px;height:17px;border-radius:2px;vertical-align:middle;margin-right:4px}

/* Geral */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.grid3b{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.vbars{display:flex;justify-content:space-around;align-items:flex-end;height:170px;border-bottom:1px solid var(--line);padding:0 6px}
.vbars .vb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;flex:1}
.vbars .vb i{display:block;width:54%;max-width:52px}
.vlabels{display:flex;justify-content:space-around;text-align:center;padding-top:6px}
.vlabels div{flex:1}
.vlabels b{display:block;font-family:var(--fc);font-weight:700;font-size:15px}
.vlabels strong{display:block;font-family:var(--fc);font-weight:800;font-size:19px}
.vlabels span{font-size:12px;color:var(--ink2)}
.hsit{display:grid;grid-template-columns:auto 1fr auto;gap:20px 16px;align-items:center;padding:10px 6px}
.hsit .lb{font-size:16px}
.hsit .hb{height:34px;position:relative;display:flex;align-items:center}
.hsit .hb i{display:block;height:100%;border-radius:2px}
.hsit .hb b{margin-left:12px;font-family:var(--fc);font-weight:800;font-size:19px}
.hsit .nv{font-size:16px;text-align:right}

/* Por jogo */
.gamebar{display:grid;grid-template-columns:minmax(360px,1.7fr) repeat(3,minmax(0,1fr)) auto;gap:12px;align-items:stretch;margin-bottom:12px}
.gb{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.gb.sel{gap:20px}
.gb.sel label{font-family:var(--fc);font-weight:800;font-size:21px;text-transform:uppercase;white-space:nowrap}
.gb.sel select{flex:1;min-width:0;width:100%;border:1px solid #9fb0a6;border-radius:5px;padding:8px 12px;font-weight:600;font-size:16px;background:var(--card)}
.gb svg{width:30px;height:30px;color:var(--g800);flex:0 0 30px}
.gb small{display:block;font-size:12px;color:var(--ink2);text-transform:uppercase}
.gb b{font-family:var(--fc);font-weight:700;font-size:18px}
.score{display:flex;align-items:center;gap:18px;padding:6px 16px}
.score .tm{text-align:center;font-family:var(--fc);font-weight:700;font-size:14px;width:84px;line-height:1.1}
.score .tm img{width:44px;height:44px;object-fit:contain;display:block;margin:0 auto 2px}
.score .pl{font-family:var(--fc);font-weight:800;font-size:40px;letter-spacing:6px;white-space:nowrap}
.score .pl em{font-style:normal;font-size:24px;margin:0 6px;letter-spacing:0}
.kpis.k6b .kpi{align-items:center}
.subtag,.athc .i span.subtag{display:inline-block;font-size:10.5px;font-weight:700;font-family:var(--fb);background:#e2eee6;color:#145c33;border:1px solid #b9d8c3;border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:middle;line-height:15px;width:auto}
.ico-boot{display:inline-flex;align-items:center;gap:1px;color:var(--ink)}
.ico-boot svg{width:15px;height:15px;vertical-align:-3px}
.gl-row.click{cursor:pointer;transition:border-color .12s,box-shadow .12s}
.gl-row.click:hover{border-color:var(--g400);box-shadow:0 0 0 3px rgba(63,174,104,.15)}
.det-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
.det-grid .pitch{aspect-ratio:1/.95}
.det-sec{margin-bottom:14px}
.det-sec h4{font-family:var(--fc);font-weight:800;font-size:17px;text-transform:uppercase;margin:0 0 6px;display:flex;align-items:center;gap:8px;color:var(--g700)}
.det-list{display:flex;flex-direction:column;gap:4px}
.det-list div{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;background:var(--card2);font-size:14px}
.det-list div b{font-family:var(--fc);font-size:15px;min-width:34px}
.det-list .min{font-family:var(--fc);font-weight:800;color:var(--g600);min-width:34px}
.sub-in{color:#1b9a4a;font-weight:800}.sub-out{color:var(--red);font-weight:800}
.tok-badges{display:flex;gap:2px;margin-top:1px;background:rgba(255,255,255,.92);border-radius:3px;padding:0 4px;font-size:11px;font-weight:700;color:#111;align-items:center;line-height:16px}
.tok-badges .ico-boot svg{width:12px;height:12px;vertical-align:-2px}
.tok-badges i{display:inline-block;width:7px;height:10px;border-radius:1px}
.det-head{display:flex;align-items:center;justify-content:center;gap:22px;padding:6px 0 14px;flex-wrap:wrap}
.det-head .tm{text-align:center;font-family:var(--fc);font-weight:700;font-size:16px;width:120px}
.det-head .tm img{width:56px;height:56px;object-fit:contain;display:block;margin:0 auto 4px}
.det-head .pl{font-family:var(--fc);font-weight:800;font-size:46px;letter-spacing:4px}
@media (max-width:900px){.det-grid{grid-template-columns:1fr}}
.foto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin:12px 0}
.foto-it{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--card2);display:flex;flex-direction:column;gap:6px}
.foto-it.nok{border-color:#f1d27a;background:#fffaea}
:root[data-theme="dark"] .foto-it.nok{background:#2a2614}
.foto-it img{width:100%;height:170px;object-fit:contain;object-position:center bottom;border-radius:6px;background:radial-gradient(ellipse at 50% 30%,#2a2f2c,#111513)}
.foto-it .fn{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foto-it select{border:1px solid var(--line);border-radius:6px;padding:5px;background:var(--card);font-size:12.5px;width:100%}
.pdf-view{display:flex;flex-direction:column;gap:12px;align-items:center;max-height:70vh;overflow:auto;background:#d9dfdb;padding:12px;border-radius:8px}
.pdf-view canvas{max-width:100%;height:auto!important;box-shadow:0 2px 10px rgba(0,0,0,.2);background:#fff}
.carbtn{width:30px;height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center}
.carbtn:hover:not(:disabled){background:rgba(255,255,255,.2)}
.carbtn:disabled{opacity:.35;cursor:not-allowed}
.gcards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.gcard{border:1px solid var(--line);border-radius:12px;background:var(--card2);padding:14px 16px 10px;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:border-color .12s,transform .12s;position:relative;overflow:hidden}
.gcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#c4cdc8}
.gcard.res-V::before{background:var(--g500)}.gcard.res-D::before{background:var(--red)}.gcard.res-E::before{background:#8a948f}
.gcard:hover{border-color:var(--g400);transform:translateY(-2px)}
.gc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.catb{display:inline-block;background:rgba(27,138,74,.15);color:var(--g500);border:1px solid rgba(27,138,74,.35);font-weight:800;font-size:11px;letter-spacing:.4px;padding:2px 8px;border-radius:5px}
.gc-top .comp{font-size:13px;color:var(--ink2);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.gc-top .dt{text-align:right;line-height:1.1}.gc-top .dt b{font-family:var(--fc);font-size:17px}.gc-top .dt small{display:block;font-size:11.5px;color:var(--ink2)}
.gc-mid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.gc-mid .tm{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.gc-mid .tm img{width:40px;height:40px;object-fit:contain}
.gc-mid .tm span{font-size:13px;font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-mid .sc{font-family:var(--fc);font-weight:800;font-size:26px;white-space:nowrap}
.gc-mid .sc em{font-style:normal;font-size:15px;margin:0 5px;color:var(--ink3)}
.gc-mid .sc em.vs{font-size:18px;margin:0}
.gc-bot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:8px;font-size:12px}
.gc-bot .casa{color:var(--g500);font-weight:700}.gc-bot .fora{color:var(--orange);font-weight:700}
.dm{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:center}
.dm-main{display:flex;gap:16px;align-items:center;min-width:0}
.dm-main img{width:130px;height:150px;object-fit:contain;object-position:center bottom;border-radius:10px;background:radial-gradient(ellipse at 50% 30%,#2a2f2c,#111513);flex:0 0 130px}
.dm-info{min-width:0}
.dm-nome{font-family:var(--fc);font-weight:800;font-size:28px;text-transform:uppercase;margin-top:6px;line-height:1.05}
.dm-sts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.dm-st{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;text-align:center;min-width:64px}
.dm-st b{display:block;font-family:var(--fc);font-weight:800;font-size:20px;color:var(--g600)}
.dm-st span{font-size:11px;color:var(--ink2)}
@container rep (max-width:1200px){.gcards{grid-template-columns:repeat(3,minmax(0,1fr))}.dm{grid-template-columns:1fr}}
@container rep (max-width:700px){.gcards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container rep (max-width:440px){.gcards{grid-template-columns:1fr}.dm-main{flex-direction:column;align-items:flex-start}}
.pn-row{display:grid;grid-template-columns:1.7fr 1fr;gap:14px}
.hl-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:16px}
.hl.hlc{box-shadow:none;background:var(--card2)}
.hl.hlc img{width:62px;height:80px}
.hl.hlc .x{padding:8px 10px}
.hl.hlc .x small{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl.hlc .x b{font-size:17px}
.hl.hlc .x span{font-size:12px}
.hl.hlc .x strong{font-size:22px}
.seg{display:inline-flex;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;color:#e6f2ea;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:6px;cursor:pointer;font-family:var(--fb)}
.seg button.on{background:#fff;color:var(--g800)}
.perf{width:100%;height:auto;color:var(--ink);display:block}
.perf-info{display:flex;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.perf-info .res{flex:0 0 28px}
.gbars{display:flex;gap:10px;align-items:stretch;overflow-x:auto;padding-top:4px}
.gb2{flex:1;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;border-radius:8px;padding:6px 2px;transition:background .12s}
.gb2:hover{background:var(--card2)}
.gb2 .pair{display:flex;gap:4px;align-items:flex-end;height:140px}
.gb2 .bwrap{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;width:16px}
.gb2 .bwrap b{font-family:var(--fc);font-size:13px;margin-bottom:2px}
.gb2 .bwrap i{display:block;width:100%;border-radius:3px 3px 0 0;min-height:2px}
.gb2 small{font-size:11px;max-width:84px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.thsort{border:0;background:none;color:#fff;font:inherit;text-transform:inherit;cursor:pointer;padding:0;white-space:nowrap}
.thsort.on{color:var(--gold)}
table.rank tr.top1 td{background:rgba(242,184,27,.12)!important}
table.rank tr.top2 td{background:rgba(160,170,165,.13)!important}
table.rank tr.top3 td{background:rgba(205,127,50,.12)!important}
table.rank td{padding:6px 8px}
@container rep (max-width:1300px){.hl-row{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container rep (max-width:1000px){.pn-row{grid-template-columns:1fr}}
@container rep (max-width:600px){.hl-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fakesel{flex:1;min-width:0;border:1px solid #9fb0a6;border-radius:5px;padding:8px 12px;font-weight:600;font-size:16px;background:var(--card);display:flex;justify-content:space-between;white-space:nowrap;overflow:hidden}
.pj-grid{display:grid;grid-template-columns:1.1fr 1fr .65fr;gap:12px;margin-bottom:12px}
.pitch{position:relative;background:repeating-linear-gradient(180deg,#1f7a3d 0 9%,#1a6e36 9% 18%);border:3px solid #fff;margin:8px;border-radius:2px;aspect-ratio:1/0.9;overflow:hidden}
.pitch svg.lines{position:absolute;inset:0;width:100%;height:100%}
.pl-tok{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:default}
.pl-tok svg{width:46px;height:46px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.pl-tok .nm{background:#fff;color:#111;font-size:12px;font-weight:600;padding:2px 8px;border-radius:3px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.pl-tok.empty .nm{background:rgba(255,255,255,.75);color:#555}
.hbars{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;align-items:center}
.hbars .lb{font-size:14px;color:var(--ink)}
.hbars .hb{display:flex;align-items:center;gap:8px}
.hbars .hb i{display:block;height:24px;border-radius:1px}
.hbars .hb b{font-family:var(--fc);font-weight:800;font-size:16px;white-space:nowrap}
.hbars .hb b span{font-weight:500;color:var(--ink2)}
.st-badge{display:inline-block;width:100%;max-width:100px;padding:2px 0;border-radius:2px;color:#fff;font-size:12px;font-weight:600}
.st-T{background:var(--g500)}
.st-R{background:#1e88e5}

/* Posição */
.pcards{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:16px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.acard{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);min-width:0}
.acard .photo{position:relative;background:radial-gradient(ellipse at 50% 30%,#2a2f2c 0%,#111513 70%);height:230px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.acard .photo img{height:100%;width:100%;object-fit:contain;object-position:center bottom}
.acard .photo .foot{position:absolute;left:12px;top:12px;color:#fff;display:flex;gap:6px;align-items:flex-start;font-family:var(--fc);font-weight:700;font-size:14px;line-height:1.1;text-transform:uppercase}
.acard .photo .foot svg{width:24px;height:30px}
.acard .photo .ring{position:absolute;right:10px;top:8px;text-align:center;color:#fff;font-family:var(--fc);font-weight:700;font-size:14px}
.acard .photo .ring .r{position:relative;width:56px;height:56px}
.acard .photo .ring .r b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-weight:800}
.acard .name{font-family:var(--fc);font-weight:800;font-size:22px;text-align:center;padding:10px 8px 2px;text-transform:uppercase}
.acard .bio{text-align:center;font-size:12px;color:var(--ink2);padding-bottom:6px}
.acard .st{padding:0 16px}
.acard .st>div{display:flex;align-items:center;gap:12px;padding:6px 2px;border-bottom:1px solid var(--line);font-size:15px}
.acard .st>div svg{width:20px;height:20px;color:var(--ink);flex:0 0 20px}
.acard .st>div b{margin-left:auto;font-family:var(--fc);font-weight:800;font-size:19px}
.acard .cards{display:flex;justify-content:space-between;padding:12px 20px 14px}
.acard .cards span{display:flex;align-items:center;gap:12px;font-family:var(--fc);font-weight:800;font-size:18px}
.acard .cards i{display:inline-block;width:20px;height:26px;border-radius:2px}
.pos-grid{display:grid;grid-template-columns:1.5fr 1fr .7fr;gap:14px}
.mini-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini-kpis .kpi{box-shadow:none;background:var(--card2);border:0}
.hdist{display:grid;grid-template-columns:auto 1fr auto;gap:14px 14px;align-items:center}
.hdist .track{height:24px;border-radius:2px}
.hdist .vv{font-family:var(--fc);font-weight:700;font-size:16px}
.hdist .axis{grid-column:2;display:flex;justify-content:space-between;font-size:12px;color:var(--ink2)}
.pos-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;display:inline-flex;gap:7px;align-items:center}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip.on{background:var(--g700);color:#fff;border-color:var(--g700)}

/* Management pages */
.page-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.page-h h2{font-family:var(--fc);font-weight:800;font-size:28px;margin:0;text-transform:uppercase}
.page-h .sp{flex:1}
.search{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 12px;min-width:220px}
.athgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.athc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
.athc img{width:58px;height:68px;border-radius:6px;object-fit:contain;object-position:center bottom;background:radial-gradient(ellipse at 50% 30%,#2a2f2c,#111513)}
.athc .i{flex:1;min-width:0}
.athc .i b{display:block;font-family:var(--fc);font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.athc .i span{display:block;font-size:12.5px;color:var(--ink2)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:var(--ink2)}
.empty h3{font-family:var(--fc);font-size:24px;color:var(--ink);margin:0 0 6px}
.empty .acts{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}

.games-list{display:flex;flex-direction:column;gap:8px}
.gl-row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:grid;grid-template-columns:96px 1fr auto auto;gap:14px;align-items:center;box-shadow:var(--shadow)}
.gl-row .dt{font-family:var(--fc);font-weight:700;font-size:16px;line-height:1.1}
.gl-row .dt small{display:block;font-family:var(--fb);font-weight:500;font-size:12px;color:var(--ink2)}
.gl-row .mt{display:flex;align-items:center;gap:12px;min-width:0}
.gl-row .mt img{width:34px;height:34px;object-fit:contain}
.gl-row .mt b{font-family:var(--fc);font-weight:700;font-size:18px;white-space:nowrap}
.gl-row .mt .sc{font-family:var(--fc);font-weight:800;font-size:22px;padding:0 6px;white-space:nowrap}
.gl-row .mt .info{font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:#fff;font-family:var(--fc);font-weight:800;font-size:16px}
.res.V{background:var(--g500)}.res.E{background:#8a948f}.res.D{background:var(--red)}.res.N{background:#c4cdc8;color:#333}

.gp-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:14px}
.hl-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
.hl{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);display:flex}
.hl img{width:84px;height:100px;object-fit:contain;object-position:center bottom;background:radial-gradient(ellipse at 50% 30%,#2a2f2c,#111513)}
.hl .x{padding:10px 14px;min-width:0;flex:1}
.hl .x small{display:block;font-family:var(--fc);font-weight:700;font-size:14px;color:var(--g600);text-transform:uppercase}
.hl .x b{display:block;font-family:var(--fc);font-weight:800;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl .x span{font-size:13px;color:var(--ink2)}
.hl .x strong{font-family:var(--fc);font-size:28px;font-weight:800;color:var(--g600);line-height:1}
.gp-two{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:14px}
.ranklist{display:flex;flex-direction:column}
.ranklist div{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.ranklist div:last-child{border:0}
.ranklist em{font-style:normal;width:22px;font-family:var(--fc);font-weight:800;color:var(--ink3)}
.ranklist b{margin-left:auto;font-family:var(--fc);font-size:18px}
.gchart{display:flex;align-items:flex-end;gap:6px;height:170px;padding:16px 4px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.gchart .gc{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;min-width:22px;height:100%;justify-content:flex-end}
.gchart .gc .pair{display:flex;gap:2px;align-items:flex-end;height:100%}
.gchart .gc i{display:block;width:9px;border-radius:2px 2px 0 0}
.gchart .gc small{font-size:10px;color:var(--ink3)}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(5,20,12,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) 14px 20px;overflow:auto}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:760px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.modal.xl{max-width:1180px}
.modal .mh{background:linear-gradient(90deg,var(--g800),var(--g700));color:#fff;padding:12px 18px;display:flex;align-items:center;gap:10px}
.modal .mh h3{margin:0;font-family:var(--fc);font-weight:800;font-size:22px;text-transform:uppercase;flex:1}
.modal .mh .icon-btn{color:#fff}
.modal .mb{padding:18px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.modal .mf .msg{margin-right:auto;font-size:13px;color:var(--ink2)}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 14px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.s2{grid-column:span 2}.f.s4{grid-column:1/-1}
.f label{font-size:11.5px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.3px}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--card2);border-radius:8px;padding:8px 10px;width:100%}
.f input:focus,.f select:focus{border-color:var(--g400);outline:none;box-shadow:0 0 0 3px rgba(63,174,104,.2)}
.f .hint{font-size:12px;color:var(--g600);font-weight:600}
.upl{display:flex;gap:12px;align-items:center}
.upl img{width:96px;height:120px;object-fit:contain;object-position:center bottom;border-radius:8px;background:radial-gradient(ellipse at 50% 30%,#2a2f2c,#111513)}
.upl.logo img{width:56px;height:56px;object-fit:contain;background:var(--card2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 14px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:700;color:var(--ink2);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--g600);border-bottom-color:var(--g500)}
.reltbl td input[type=number]{width:58px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card2);text-align:center}
.reltbl td select{padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card2)}
.reltbl tr.nr td{color:var(--ink3)}
.reltbl tr.T td:first-child{box-shadow:inset 4px 0 0 var(--g500)}
.reltbl tr.R td:first-child{box-shadow:inset 4px 0 0 #1e88e5}
.counters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.counters span{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px}
.counters b{font-family:var(--fc);font-size:16px}
.esc-wrap{display:grid;grid-template-columns:1fr 300px;gap:14px}
.esc-wrap .pitch{max-width:560px;margin:0 auto;width:100%}
.esc-wrap .pl-tok{cursor:pointer}
.esc-wrap .pl-tok.sel svg{filter:drop-shadow(0 0 6px var(--gold))}
.bench{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow:auto}
.bench button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card2);border-radius:8px;padding:6px 10px;cursor:pointer;text-align:left}
.bench button.used{opacity:.45}
.bench button:hover{border-color:var(--g400)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--g800);color:#fff;padding:10px 18px;border-radius:10px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.3);font-weight:600}
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.taglist{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.taglist span{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;display:inline-flex;align-items:center;gap:4px}
.taglist span button{border:0;background:transparent;cursor:pointer;color:var(--ink3);font-size:16px;line-height:1}
.row-add{display:flex;gap:8px}
.row-add input{flex:1;border:1px solid var(--line);background:var(--card2);border-radius:8px;padding:8px 10px}
.muted{color:var(--ink2)}

.rwrap{container:rep / inline-size;width:100%}
@container rep (max-width:1600px){
  .gamebar{grid-template-columns:repeat(3,minmax(0,1fr)) auto}
  .gamebar .gb.sel{grid-column:1/-1}
}
@container rep (max-width:1480px){
  .rhead .t3{display:none}
  .rhead .t1{font-size:32px;white-space:nowrap}
  .rhead .t2{font-size:16px;white-space:nowrap}
  .rhead .bigtitle{font-size:36px}
}
@container rep (max-width:1200px){
  .rhead .t3{display:none}
  .kpis{grid-template-columns:repeat(3,1fr)}
  .poscards{grid-template-columns:repeat(4,1fr)}
  .grid3{grid-template-columns:1fr 1fr}
  .grid3>:last-child{grid-column:1/-1}
  .pj-grid{grid-template-columns:1fr 1fr}
  .pj-grid>:first-child{grid-column:1/-1}
  .gamebar{grid-template-columns:1fr 1fr 1fr}
  .gamebar .gb.score{grid-column:1/-1;justify-content:center}
  .gamebar .gb.sel{grid-column:1/-1}
  .rhead .meta{display:none}
  .pos-grid{grid-template-columns:1fr 1fr}
  .pos-grid>:first-child{grid-column:1/-1}
  .gp-grid{grid-template-columns:repeat(3,1fr)}
  .ind-top{grid-template-columns:280px 1fr}
  .ind-kpis{grid-template-columns:repeat(3,1fr)}
  .ind-mid{grid-template-columns:1fr 1fr}
  .ind-mid>:first-child{grid-column:1/-1}
}
@container rep (max-width:800px){
  .duo,.grid3,.grid3b,.gp-two,.pos-grid,.pj-grid,.ind-top,.ind-mid,.ind-hist{grid-template-columns:1fr}
  .pos-grid>:first-child,.pj-grid>:first-child,.grid3>:last-child,.ind-mid>:first-child{grid-column:auto}
  .kpis,.ind-kpis{grid-template-columns:repeat(2,1fr)}
  .poscards{grid-template-columns:repeat(2,1fr)}
  .hl-grid{grid-template-columns:1fr 1fr}
  .rhead .slogan{display:none}
  .rhead{flex-wrap:wrap}
  .rhead .t1{font-size:28px}
  .gamebar{grid-template-columns:1fr 1fr}
  .mini-kpis{grid-template-columns:1fr 1fr}
}
@container rep (max-width:500px){
  .kpi{flex-direction:column;gap:6px;padding:12px}
  .kpis .kpi .k{font-size:14px}
  .kpi .v{font-size:25px}
  .kpi svg{width:34px;height:34px;flex-basis:34px}
  .hl-grid,.gp-grid{grid-template-columns:1fr 1fr}
  .rhead .center{flex-basis:100%;text-align:left}
  .gamebar{grid-template-columns:1fr}
}
@media (max-width:900px){
  .esc-wrap,.rep-layout,.imp-grid{grid-template-columns:1fr}
  .form{grid-template-columns:1fr 1fr}
  .gl-row{grid-template-columns:70px 1fr auto}
  .gl-row .acts{grid-column:1/-1;justify-self:end}
}
@media (max-width:600px){
  .topbar{flex-wrap:nowrap;overflow-x:auto;padding:8px 10px}
  .topbar .crumb{font-size:16px;white-space:nowrap}
  .topbar .crumb small{display:none}
  .side{width:56px;flex-basis:56px}
  .nav-btn{width:40px;height:40px}
  .content{padding:12px 10px 24px}
}

/* ---------- Relatório individual do atleta ---------- */
.ind-top{display:grid;grid-template-columns:330px 1fr;gap:14px;margin-bottom:14px}
.ind-card .photo{height:300px}
.ind-card .bio2{padding:4px 16px 12px}
.ind-card .bio2>div{display:flex;justify-content:space-between;padding:6px 2px;border-bottom:1px solid var(--line);font-size:14.5px}
.ind-card .bio2>div:last-child{border:0}
.ind-card .bio2 b{font-family:var(--fc);font-weight:800;font-size:17px}
.ind-right{display:flex;flex-direction:column;gap:14px;min-width:0}
.ind-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.ind-kpis .kpi{padding:12px 14px;gap:10px}
.ind-kpis .kpi svg{width:36px;height:36px;flex-basis:36px}
.ind-kpis .kpi .v{font-size:27px}
.ind-mid{display:grid;grid-template-columns:1.25fr .8fr 1fr;gap:14px}
.cmp{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center}
.cmp .lb{font-size:14px}
.cmp .bars{display:flex;flex-direction:column;gap:3px}
.cmp .bars div{display:flex;align-items:center;gap:8px;font-size:12px}
.cmp .bars i{display:block;height:12px;border-radius:2px}
.cmp .bars b{font-family:var(--fc);font-size:14px}
.ind-hist{display:grid;grid-template-columns:1fr 1fr;gap:0}
.ind-hist .tbl-wrap+.tbl-wrap{border-left:2px solid var(--line)}

/* ---------- Página de relatórios / PDF ---------- */
.rep-layout{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.rep-side{position:sticky;top:0;display:flex;flex-direction:column;gap:12px}
.rep-opt{border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}
.rep-opt>label{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;font-weight:700;font-family:var(--fc);font-size:17px;text-transform:uppercase}
.rep-opt>label input{width:18px;height:18px;accent-color:var(--g500)}
.rep-opt>label small{margin-left:auto;font-family:var(--fb);font-weight:500;font-size:12px;color:var(--ink3);text-transform:none}
.rep-sub{border-top:1px solid var(--line);padding:8px 14px 12px;display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto;background:var(--card2)}
.rep-sub label{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
.rep-sub label input{accent-color:var(--g500)}
.rep-sub .tools{display:flex;gap:10px;font-size:12px;margin-bottom:2px}
.rep-sub .tools button{border:0;background:none;color:var(--g600);font-weight:700;cursor:pointer;padding:0}
.rep-sub input.search{min-width:0;padding:6px 10px;font-size:13px}
.rep-sub select{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--card)}
.rep-actions{display:flex;flex-direction:column;gap:8px}
.rep-actions .btn{justify-content:center;padding:11px 14px;font-size:15px}
.rep-prev{display:flex;flex-direction:column;gap:18px;min-width:0}
.pg-thumb{background:#c9d3cd;border-radius:6px;padding:0;overflow:hidden;box-shadow:var(--shadow);position:relative}
.pg-thumb .pgn{position:absolute;right:10px;top:8px;z-index:2;background:rgba(6,42,23,.85);color:#fff;font-size:12px;padding:3px 9px;border-radius:999px;font-weight:600}
.pg-scale{transform-origin:0 0}
.pdfpage{width:1536px;height:1024px;overflow:hidden;position:relative;padding:14px 16px 6px;display:flex;flex-direction:column;
  --bg:#eef2ef;--card:#fff;--card2:#f6f8f7;--line:#dfe6e2;--ink:#14201a;--ink2:#4b5a52;--ink3:#7d8b84;--row:#f7faf8;--shadow:0 1px 2px rgba(10,40,25,.08),0 4px 14px rgba(10,40,25,.06);
  background:var(--bg);color:var(--ink)}
.pdfpage .kpi svg{color:var(--g800)!important}
.pdfpage,.pdfpage *{box-shadow:none!important;text-shadow:none!important}
.pdfpage .rhead::after{display:none}
.pdfpage .track{background:#e9eeeb!important}
.pdfpage .pg-fit{transform-origin:top center;width:100%}
.pdfpage .rwrap{width:100%}
.pdfpage .report{max-width:none}
.pdfpage .pcards{overflow:visible;grid-auto-columns:minmax(0,1fr)}
.pdfpage .no-print,.pdfpage .carbtn,.pdfpage .seg,.pdfpage [data-act=rankAll],.pdfpage .perf-info .btn{display:none!important}
.pdfpage.tall{height:auto;overflow:visible}
.pdfpage .gcard:hover,.pdfpage .gb2:hover{transform:none;background:inherit}
.pdfpage .rbody{padding-top:10px}
.pdfpage .kpis{margin-bottom:10px;gap:12px}
.pdfpage .kpi{padding:10px 14px}
.pdfpage .kpi .v{font-size:28px}
.pdfpage .grid3,.pdfpage .duo,.pdfpage .pj-grid,.pdfpage .gamebar{margin-bottom:10px}
.pdfpage .gamebar{grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr)) auto!important}
.pdfpage .gamebar .gb.sel{grid-column:auto!important}
.pdfpage .gb{padding:8px 14px}
.pdfpage table.t{font-size:12.5px}
.pdfpage table.t td{padding:2px 7px}
.pdfpage table.t th{padding:4px 7px;font-size:13px}
.pdfpage .ava{width:19px;height:19px}
.pdfpage .ptag{padding:1px 5px;font-size:12px}
.pdfpage .st-badge{padding:1px 0}
.pdfpage .rfoot{padding-top:8px}
.pdfpage .pitch{aspect-ratio:1/.74;margin:4px}
.pdfpage .pl-tok svg{width:38px;height:38px}
.pdfpage .acard .photo{height:196px}
.pdfpage .acard .st>div{padding:4px 2px}
.pdfpage .acard .name{padding-top:6px}
.pdfpage .acard .cards{padding:8px 20px 10px}
.pdfpage .pcards{margin-bottom:12px}
.pdfpage .ind-card .photo{height:220px}
.pdfpage .ind-card .bio2>div{padding:3px 2px}
.pdfpage .ind-top{margin-bottom:10px}
.pdfpage .vchart{height:170px!important}
.pdfpage .hsit{gap:14px 16px}
.pdfpage .poscards{padding:10px}
.pdfpage .dist{gap:5px 14px}
.pdfpage.capa{background:#0a5410;color:#ffb400;font-family:'Montserrat',var(--fb);padding:0;display:block;position:relative}
.capa .c-top{position:absolute;top:44px;left:0;right:0;text-align:center;font-weight:700;font-size:24px;letter-spacing:.3px;text-transform:uppercase}
.capa .c-mid{position:absolute;left:0;right:0;top:50%;transform:translateY(-58%);text-align:center}
.capa .c-tit{font-weight:800;font-size:128px;line-height:1;letter-spacing:1px;text-transform:uppercase}
.capa .c-tit.m{font-size:104px}.capa .c-tit.s{font-size:84px}
.capa .c-sub{font-weight:600;font-size:22px;margin-top:22px;opacity:.85;text-transform:uppercase;letter-spacing:.5px}
.capa .c-prof{font-weight:500;font-size:19px;margin-top:22px;text-transform:uppercase;letter-spacing:.3px;line-height:1.7}
.capa .c-logo{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);width:72px;height:80px;object-fit:contain}
.capa .c-ano{position:absolute;right:42px;bottom:40px;font-family:'Barlow Condensed','Montserrat',sans-serif;font-weight:800;font-size:118px;line-height:.86;text-align:center}
.pg-thumb .capa{color:#ffb400}
.prog{position:fixed;inset:0;background:rgba(5,20,12,.6);z-index:150;display:grid;place-items:center}
.prog>div{background:var(--card);border-radius:14px;padding:24px 30px;min-width:300px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.prog .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
.prog .bar i{display:block;height:100%;background:var(--g500);transition:width .2s}

/* ---------- Importação ---------- */
.imp-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.imp-card .pb p{margin-top:0}
.drop{border:2px dashed var(--line);border-radius:12px;padding:26px 16px;text-align:center;cursor:pointer;display:block;background:var(--card2);transition:border-color .15s}
.drop:hover,.drop.over{border-color:var(--g400)}
.drop b{display:block;font-family:var(--fc);font-size:19px;margin-bottom:4px}
.cols{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.cols code{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:12px}
.cols code.req{border-color:var(--g400);color:var(--g600);font-weight:700}
.warn{background:#fff6dc;border:1px solid #f1d27a;color:#6a5208;border-radius:8px;padding:8px 12px;font-size:13px;margin:8px 0}
.okmsg{background:#e6f6ec;border:1px solid #9ad4ad;color:#145c33;border-radius:8px;padding:8px 12px;font-size:13px;margin:8px 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media print{
  .side,.topbar,.no-print{display:none!important}
  .content{overflow:visible;padding:0}
  body,.app,.main{height:auto;display:block;background:#fff}
  .report{max-width:none}
  @page{size:A4 landscape;margin:8mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

const kpi=(ic,k,v,s)=>`<div class="kpi">${ic}<div style="min-width:0"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div></div>`;
function donut(segs,size=190,th=34,big='',small=''){
  const r=(size-th)/2,C=2*Math.PI*r,total=segs.reduce((t,s)=>t+s.v,0)||1;let off=0;
  const arcs=segs.map(s=>{const len=s.v/total*C;const a=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${s.c}" stroke-width="${th}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})"/>`;off+=len;return a;}).join('');
  return `<div class="donut" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(big)} ${esc(small)}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${th}"/>${arcs}</svg><div class="c"><b>${big}</b><span>${small}</span></div></div>`;
}
function ring(p,size=56){
  const th=6,r=(size-th)/2,C=2*Math.PI*r,len=Math.min(100,p)/100*C;const col=p>=70?'#39b54a':p>=50?'#f6c21c':'#e3342b';
  return `<div class="r"><svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="${th}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${th}" stroke-dasharray="${len} ${C}" transform="rotate(-90 ${size/2} ${size/2})" stroke-linecap="round"/></svg><b>${p}%</b></div>`;
}

function emptyReport(msg){

   ${all.map((r,i)=>`<tr><td>${i+1}</td><td class="l"><div class="athcell"><img class="ava" src="${fotoDe(r.a)}" alt="">${esc(r.a.nome)}${subTag(r.a)}${+r.gols?` <span title="Gols">⚽${+r.gols>1?'×'+r.gols:''}</span>`:''}${+r.assist?` <span class="ico-boot" title="Assistências">${IC.boot}${+r.assist>1?'×'+r.assist:''}</span>`:''}</div></td><td><span class="ptag" style="background:${PC2[r.a.posicao]}">${r.a.posicao}</span></td><td><span class="st-badge st-${r.status}">${r.status==='T'?'Titular':'Reserva'}</span></td><td>${+r.min||0}</td></tr>`).join('')}</tbody></table></div></div>`;
  const form=`<div class="panel"><div class="ph">Formação inicial (${esc(j.formacao||'4-2-3-1')})</div><div style="background:#0f3d22;padding:2px">${pitch(j)}</div></div>`;

  const ordP=['GOL','ZAG','LAT','VOL','MEI','ATA','EXT'].filter(p=>p!=='EXT'||pp.EXT>0);const mx=Math.max(1,...ordP.map(p=>pp[p]));
  const mpos=`<div class="panel" style="margin-bottom:12px"><div class="ph">Minutos por posição</div><div class="pb"><div class="hbars">${ordP.map(p=>`<div class="lb">${POSS[p]}</div><div class="hb"><i style="width:${pp[p]/mx*72}%;background:${PC3[p]}"></i><b>${nf(pp[p])} <span>(${pct(pp[p],tot)}%)</span></b></div>`).join('')}</div></div></div>`;
  const dist=`<div class="panel"><div class="ph">Distribuição de minutos</div><div class="pb"><div class="donut-wrap">${donut([{v:minT,c:'#0b4a28'},{v:minR,c:'#2fae57'}],150,26,nf(tot),'minutos')}
    <div class="legend"><div class="li"><span class="sw round" style="background:#0b4a28"></span><div><b>Titulares</b><span>${nf(minT)} (${pct(minT,tot)}%)</span></div></div><div class="li"><span class="sw round" style="background:#2fae57"></span><div><b>Reservas</b><span>${nf(minR)} (${pct(minR,tot)}%)</span></div></div></div></div></div></div>`;
  const half=Math.ceil(nrl.length/2);const mot=j.motivos||{};
  const nrT=(arr,st)=>`<div class="tbl-wrap" style="flex:1;min-width:300px"><table class="t"><thead><tr><th>#</th><th style="min-width:150px">Atleta</th><th>Pos</th><th style="min-width:160px">Motivo</th></tr></thead><tbody>${arr.map((a,i)=>`<tr><td>${rel.length+st+i+1}</td><td class="l"><div class="athcell"><img class="ava" src="${fotoDe(a)}" alt="">${esc(a.nome)}${subTag(a)}</div></td><td><span class="ptag" style="background:${PC2[a.posicao]}">${a.posicao}</span></td><td class="l">${esc(mot[a.id]||'Opção técnica')}</td></tr>`).join('')}</tbody></table></div>`;
  const nr=`<div class="panel"><div class="ph">Não relacionados (${nrl.length})</div>${nrl.length?`<div style="display:flex;gap:12px;flex-wrap:wrap;padding:0">${nrT(nrl.slice(0,half),0)}${nrT(nrl.slice(half),half)}</div>`:'<div class="pb muted">Todo o elenco da categoria foi relacionado.</div>'}</div>`;
  return `<div class="report">${h}<div class="rbody">${bar}${kp}<div class="pj-grid">${relT}${form}<div>${mpos}${dist}</div></div>${nr}${footer('RELATÓRIO DE MINUTAGEM — POR JOGO — '+catLabelSp())}</div></div>`;

/* divide n atletas em páginas de no máximo 5, o mais equilibrado possível (8→4+4, 9→5+4, 6→3+3, 11→4+4+3) */
function dividir(n,max=5){const k=Math.max(1,Math.ceil(n/max));const base=Math.floor(n/k),extra=n%k;const out=[];let i=0;for(let x=0;x<k;x++){const t=base+(x<extra?1:0);out.push([i,i+t]);i+=t;}return out;}
function viewPosicao(pp,part){
  const jogos=jogosFiltrados(),ats=atletasCat();const p=pp||S.posSel;
  const c=calc(jogos,ats);
  const h=header({sub:'RELATÓRIO DE MINUTAGEM — POR POSIÇÃO',title:POSP[p].toUpperCase(),subcat:catLabelSp(),meta:'icons',sloganBar:true,items:[[IC.trophy,'Competição',compLabel()],[IC.kCalPlus,'Período',periodo(jogos)],[IC.ballF,'Total de jogos',String(c.nJ)]]});
  const tabs=PDFMODE?'':`<div class="pos-tabs no-print">${POS.map(x=>`<button class="chip ${x===p?'on':''}" data-pos="${x}"><i style="background:${PC1[x]}"></i>${POSP[x]}</button>`).join('')}</div>`;
  const lst=c.lista.filter(s=>s.a.posicao===p).sort((a,b)=>b.min-a.min);
  if(!jogos.length||!lst.length)return `${tabs}<div class="report">${h}<div class="rbody">${!jogos.length?emptyReport():emptyReport('Nenhum atleta cadastrado como '+POSN[p].toLowerCase()+' nesta categoria')}</div></div>`;
  const partes=dividir(lst.length);const pi=part!=null?Math.min(part,partes.length-1):null;const lstCards=pi!=null?lst.slice(partes[pi][0],partes[pi][1]):lst;
  const cards=lstCards.map(s=>{const a=s.a;const bio=[a.subcategoria||'',idade(a.nascimento)!==''?idade(a.nascimento)+' anos':'',a.altura?nf(a.altura,2)+' m':'',a.peso?nf(a.peso,1).replace(',0','')+' kg':'',a.gordura!==''&&a.gordura!=null?nf(a.gordura,1)+'% G':''].filter(Boolean).join(' | ');
    return `<div class="acard"><div class="photo"><img src="${fotoDe(a)}" alt="Foto de ${esc(a.nome)}"><div class="foot">${IC.foot}<span>Pé<br>${esc((a.pe||'—').toUpperCase())}</span></div><div class="ring">${ring(s.disp)}<div style="margin-top:4px">DISP.</div></div></div>
    <div class="name">${esc(a.nome)}</div><div class="bio">${esc(bio)||'&nbsp;'}</div>
    <div class="st"><div>${IC.clock}Minutos<b>${nf(s.min)}</b></div><div>${IC.ballF}Jogos<b>${s.J}</b></div><div>${IC.stShirt}Titular<b>${s.T}</b></div><div>${IC.bench}Reserva<b>${s.R}</b></div><div>${IC.ballF}${p==='GOL'?'Gols sofridos':'Gols'}<b>${p==='GOL'?s.GS:s.G}</b></div><div>${IC.boot}Assistências<b>${s.A}</b></div></div>
    <div class="cards"><span><i style="background:var(--yellow)"></i>${s.CA}</span><span><i style="background:var(--red)"></i>${s.CV}</span></div></div>`;}).join('');
  const tot=lst.reduce((t,s)=>t+s.min,0),us=lst.filter(s=>s.min>0).length,disp=lst.length*c.totDur;
  const mT=lst.reduce((t,s)=>t+s.minT,0),mR=lst.reduce((t,s)=>t+s.minR,0),nrc=lst.reduce((t,s)=>t+s.NR,0);
  const res=`<div class="panel"><div class="ph">Resumo dos ${POSP[p].toLowerCase()}</div><div class="pb"><div class="mini-kpis">
    ${kpi(IC.kClock,'Minutos totais',nf(tot),'Total da posição')}${kpi(IC.kTeam,'Média por atleta',nf(us?tot/us:0),'Minutos / atleta')}${kpi(IC.kCalPlus,'Jogos disputados',c.nJ,'Total de jogos')}
    ${kpi(IC.kBars,'Média por jogo',nf(c.nJ?tot/c.nJ:0),'Minutos por partida')}${kpi(IC.kTeam,'Atletas utilizados',us,'Da posição')}${kpi(IC.kPie,'% Minutos disponíveis',pct(tot,disp)+'%','De '+nf(disp)+' minutos')}</div></div></div>`;
  const mx=Math.max(500,...lst.map(s=>s.min));const step=mx>2500?1000:500;const top=Math.ceil(mx/step)*step;const tk=[];for(let v=0;v<=top;v+=step)tk.push(v);
  const dist=`<div class="panel"><div class="ph">Distribuição de minutos</div><div class="pb"><div class="hdist">${lst.map(s=>`<div>${esc(s.a.nome)}</div><div class="track"><i style="width:${s.min/top*100}%;background:linear-gradient(90deg,#17834a,#2fb064)"></i></div><div class="vv">${nf(s.min)}</div>`).join('')}
    <div></div><div class="axis">${tk.map(t=>`<span>${nf(t)}</span>`).join('')}</div><div></div></div></div></div>`;
  const t3=mT+mR;
  const sit=`<div class="panel"><div class="ph">Minutos por situação</div><div class="pb"><div class="donut-wrap" style="flex-wrap:wrap">${donut([{v:mT,c:'#0b4a28'},{v:mR,c:'#5fd06c'}],170,30,nf(tot),'minutos')}
    <div class="legend"><div class="li"><span class="sw round" style="background:#0b4a28"></span><div><b>Titular</b><span>${nf(mT)} (${pct(mT,t3)}%)</span></div></div><div class="li"><span class="sw round" style="background:#5fd06c"></span><div><b>Reserva</b><span>${nf(mR)} (${pct(mR,t3)}%)</span></div></div><div class="li"><span class="sw round" style="background:#b5bcb8"></span><div><b>Não relacionado</b><span>${nrc} ocorrências</span></div></div></div></div></div></div>`;
  return `${tabs}<div class="report">${h}<div class="rbody"><div class="pcards"${pi!=null?` style="grid-auto-flow:row;grid-template-columns:repeat(${lstCards.length},calc((100% - 64px) / 5));justify-content:center"`:''}>${cards}</div><div class="pos-grid">${res}${dist}${sit}</div>${footer('RELATÓRIO DE MINUTAGEM — POR POSIÇÃO'+(pi!=null&&partes.length>1?` — ${POSP[p].toUpperCase()} ${pi+1}/${partes.length}`:''))}</div></div>`;
}
</script>
<script>
"use strict";
/* ================= ATLETAS ================= */

  const subs=c!=='Todas'?GRUPOS[c].map(sb=>`${sb}: <b>${list.filter(a=>a.subcategoria===sb).length}</b>`).join(' · ')+(list.some(a=>!a.subcategoria)?` · sem sub: <b>${list.filter(a=>!a.subcategoria).length}</b>`:''):'';
  const head=`<div class="page-h"><h2>Atletas ${c!=='Todas'?'· '+esc(subAtivo()?S.filtro.sub:c):''}</h2><span class="muted">${list.length} cadastrados${subs?' · '+subs:''}</span><span class="sp"></span><input class="search" id="busca" placeholder="Buscar atleta" value="${esc(S.busca)}" aria-label="Buscar atleta">${S.canWrite&&S.atletas.length?`<button class="btn ${S.selMode?'gold':''}" data-act="selMode">${S.selMode?'Cancelar seleção':'☑ Selecionar'}</button><button class="btn danger" data-act="limpar">${IC.trash} Limpar dados</button>`:''}<button class="btn" data-act="expAtletas">${IC.down} Exportar Excel</button>${S.canWrite?`<label class="btn" style="cursor:pointer">🖼️ Importar fotos<input type="file" id="fotosLote" accept="image/png,image/jpeg,image/webp" multiple hidden></label><button class="btn" data-go="importar">${IC.up} Importar Excel</button><button class="btn pri" data-act="novoAtleta">${IC.plus} Novo atleta</button>`:''}</div>`;
  if(!list.length)return head+`<div class="empty"><h3>Nenhum atleta ${q?'encontrado':'cadastrado nesta categoria'}</h3><p>O cadastro do atleta alimenta todos os relatórios: posição e pé aparecem nos cards por posição, e idade, estatura, peso e % de gordura entram na ficha individual.</p><div class="acts">${S.canWrite?`<button class="btn pri" data-go="importar">${IC.up} Importar planilha Excel</button><button class="btn" data-act="novoAtleta">${IC.plus} Cadastrar atleta</button>${!S.atletas.length&&!S.jogos.length?'<button class="btn gold" data-act="demo">Carregar dados de exemplo</button>':''}`:''}</div></div>`;
  const selBar=S.selMode?`<div class="panel" style="padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:6px;position:sticky;top:0;z-index:5"><label style="display:flex;gap:8px;align-items:center;font-weight:700;cursor:pointer"><input type="checkbox" id="selAll" ${list.length&&list.every(a=>S.sel.has(a.id))?'checked':''} style="width:18px;height:18px;accent-color:var(--g500)">Selecionar todos (${list.length})</label><span class="muted">${S.sel.size} selecionado(s)</span><span style="flex:1"></span><button class="btn danger" data-act="delSel" ${S.sel.size?'':'disabled'}>${IC.trash} Excluir selecionados</button></div>`:'';
  const groups=POS.map(p=>{const g=list.filter(a=>a.posicao===p);if(!g.length)return '';
    return `<h3 style="font-family:var(--fc);font-size:20px;margin:18px 0 8px;display:flex;align-items:center;gap:8px"><span class="ptag" style="background:${PC1[p]}">${p}</span>${POSP[p]} <span class="muted" style="font-size:14px">(${g.length})</span></h3><div class="athgrid">${g.map(a=>`<div class="athc">${S.selMode?`<input type="checkbox" data-sel="${a.id}" ${S.sel.has(a.id)?'checked':''} aria-label="Selecionar ${esc(a.nome)}" style="width:18px;height:18px;accent-color:var(--g500);flex:0 0 18px">`:''}<img src="${fotoDe(a)}" alt=""><div class="i"><b>${a.numero?a.numero+' · ':''}${esc(a.nome)}${subTag(a)}</b><span>${esc(a.posDetalhe||POSN[a.posicao])} · Pé ${esc(a.pe||'—')}</span><span>${[idade(a.nascimento)!==''?idade(a.nascimento)+' anos':'',a.altura?nf(a.altura,2)+' m':'',a.peso?a.peso+' kg':'',a.gordura?a.gordura+'% G':''].filter(Boolean).join(' · ')||'&nbsp;'}</span></div>${S.canWrite?`<button class="icon-btn" data-act="editAtleta" data-id="${a.id}" aria-label="Editar ${esc(a.nome)}">${IC.edit}</button>`:''}</div>`).join('')}</div>`;}).join('');
  return head+selBar+groups;
}

   <div class="form">

    <div class="f"><label for="fNum">Camisa</label><input id="fNum" type="number" min="1" max="99" value="${esc(a.numero||'')}"></div>

/* ================= JOGOS · PAINEL ================= */
function viewJogosPainel(){
  const jogos=jogosFiltrados(),ats=atletasCat(),c=calc(jogos,ats);
  const h=header({sub:'RELATÓRIO DE JOGOS — DESEMPENHO DA EQUIPE',title:'PAINEL DE JOGOS',meta:'icons',sloganBar:true,items:[[IC.trophy,'Competição',compLabel()],[IC.kCalPlus,'Período',periodo(jogos)],[IC.ballF,'Total de jogos',String(jogos.length)]]});
  if(!jogos.length)return `<div class="report">${h}<div class="rbody">${emptyReport()}</div></div>`;
  const r={V:0,E:0,D:0,N:0};let gp=0,gc=0;const casa={V:0,E:0,D:0,n:0},fora={V:0,E:0,D:0,n:0};
  jogos.forEach(j=>{const x=resultado(j);r[x]++;gp+=+j.golsPro||0;gc+=+j.golsContra||0;const t=j.mando==='fora'?fora:casa;if(x!=='N'){t[x]++;t.n++;}});
  const disp=r.V+r.E+r.D;const aprov=disp?Math.round((r.V*3+r.E)/(disp*3)*100):0;
  const A=c.lista.reduce((t,s)=>t+s.A,0),CA=c.lista.reduce((t,s)=>t+s.CA,0),CV=c.lista.reduce((t,s)=>t+s.CV,0);
  const kk=(ic,k,v,s)=>kpi(ic,k,v,s);

/* ---------- desempenho ao longo da temporada ---------- */
function desempenhoTemporada(jogos){
  const js=jogos.filter(j=>resultado(j)!=='N');if(!js.length)return `<div class="panel"><div class="ph">📈 Desempenho ao longo da temporada</div><div class="pb muted">Cadastre placares para ver o desempenho.</div></div>`;
  let pts=0;const P=js.map((j,i)=>{const x=resultado(j);pts+=x==='V'?3:x==='E'?1:0;return {j,x,ap:Math.round(pts/((i+1)*3)*100),pts,saldo:(+j.golsPro||0)-(+j.golsContra||0)};});
  if(S.perfSel==null||S.perfSel>=P.length)S.perfSel=P.length-1;
  const W=800,H=250,L=40,R=14,T=16,B=34,iw=W-L-R,ih=H-T-B;const X=i=>L+(P.length===1?iw/2:i*iw/(P.length-1)),Y=v=>T+ih-(v/100)*ih;
  const maxS=Math.max(1,...P.map(p=>Math.abs(p.saldo)));const bw=Math.max(4,Math.min(18,iw/P.length*0.45));
  const line=P.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.ap).toFixed(1)}`).join(' ');
  const area=line+` L${X(P.length-1).toFixed(1)},${Y(0)} L${X(0).toFixed(1)},${Y(0)} Z`;
  const col={V:'#22a355',E:'#8a948f',D:'#e3342b'};const step=Math.ceil(P.length/10);
  const sel=P[S.perfSel];const sj=sel.j;const casa=sj.mando!=='fora';
  const svg=`<svg viewBox="0 0 ${W} ${H}" class="perf" role="img" aria-label="Aproveitamento acumulado por jogo">
   <defs><linearGradient id="perfG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22a355" stop-opacity=".35"/><stop offset="1" stop-color="#22a355" stop-opacity="0"/></linearGradient></defs>
   ${[0,25,50,75,100].map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="currentColor" stroke-opacity=".12"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="currentColor" fill-opacity=".6">${v}%</text>`).join('')}
   ${P.map((p,i)=>{const h=Math.abs(p.saldo)/maxS*(ih*0.28);return p.saldo?`<rect x="${X(i)-bw/2}" y="${p.saldo>0?Y(0)-h:Y(0)-h}" width="${bw}" height="${h}" rx="2" fill="${p.saldo>0?'#22a355':'#e3342b'}" fill-opacity=".22"/>`:'';}).join('')}
   <path d="${area}" fill="url(#perfG)"/><path d="${line}" fill="none" stroke="#22a355" stroke-width="2.5" stroke-linejoin="round"/>
   ${P.map((p,i)=>`<g data-act="perfPt" data-i="${i}" style="cursor:pointer"><circle cx="${X(i)}" cy="${Y(p.ap)}" r="11" fill="transparent"/><circle cx="${X(i)}" cy="${Y(p.ap)}" r="${i===S.perfSel?7:5}" fill="${col[p.x]}" stroke="${i===S.perfSel?'#f2b81b':'#fff'}" stroke-width="${i===S.perfSel?3:1.5}"/></g>`).join('')}
   ${P.map((p,i)=>i%step===0||i===P.length-1?`<text x="${X(i)}" y="${H-12}" text-anchor="middle" font-size="10.5" fill="currentColor" fill-opacity=".65">${fmtData(p.j.data).slice(0,5)}</text>`:'').join('')}</svg>`;
  return `<div class="panel"><div class="ph">📈 Desempenho ao longo da temporada<span class="r">aproveitamento acumulado · barras = saldo de gols</span></div><div class="pb">${svg}
   <div class="perf-info"><span class="res ${sel.x}">${sel.x}</span><div style="min-width:0;flex:1"><b>Jogo ${S.perfSel+1} · ${fmtData(sj.data)} · ${casa?`Porto Vitória ${sj.golsPro} x ${sj.golsContra} ${esc(sj.adversario)}`:`${esc(sj.adversario)} ${sj.golsContra} x ${sj.golsPro} Porto Vitória`}</b>
    <div class="muted" style="font-size:12.5px">${esc(sj.competicao)} · ${casa?'Em casa':'Fora'}${sj.local?' · '+esc(sj.local):''} · ${sel.pts} pontos somados · aproveitamento ${sel.ap}%</div></div><button class="btn sm" data-act="detJogo" data-id="${sj.id}">Ver jogo</button></div></div></div>`;
}

     <div class="f"><label for="jGP">Gols Porto Vitória</label><input id="jGP" type="number" min="0" value="${esc(EJ.golsPro)}"><span class="hint" id="jGPh"></span></div>
     <div class="f"><label for="jGC">Gols adversário</label><input id="jGC" type="number" min="0" value="${esc(EJ.golsContra)}"></div>
     <div class="f s2"><label for="jObs">Observações</label><input id="jObs" value="${esc(EJ.obs||'')}" placeholder="Arbitragem, clima, ocorrências"></div>
     <div class="f s4 muted" style="font-size:13px">Não achou a competição ou a categoria? Adicione em <b>Configurações</b> (ícone de engrenagem no menu).</div></div>`;
  } else if(EJtab==='rel'){

    const map={};EJ.relacionados.forEach(r=>map[r.atletaId]=r);const d=Number(EJ.duracao)||S.config.duracao?.[EJ.categoria]||90;
    const nT=EJ.relacionados.filter(r=>r.status==='T').length,nR=EJ.relacionados.filter(r=>r.status==='R').length,nE=EJ.relacionados.filter(r=>r.status==='R'&&+r.min>0).length;
    const sg=EJ.relacionados.reduce((t,r)=>t+(+r.gols||0),0);

     <span style="margin-left:auto;padding:0;border:0;background:none;display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" data-act="titMin">Titulares = ${d} min</button><button class="btn sm" data-act="relAll">Limpar relacionados</button></span></div>
     ${nT>11?'<div style="color:var(--red);font-weight:600;margin-bottom:8px">Há mais de 11 titulares marcados.</div>':''}

     ${ats.map(a=>{const r=map[a.id];const st=r?r.status:'';return `<tr class="${st||'nr'}" data-aid="${a.id}"><td class="l"><div class="athcell"><img class="ava" src="${fotoDe(a)}" alt="">${esc(a.nome)}${subTag(a)}</div></td><td><span class="ptag" style="background:${PC2[a.posicao]}">${a.posicao}</span></td>
      <td><select data-f="status" aria-label="Situação de ${esc(a.nome)}"><option value="" ${!st?'selected':''}>Não relacionado</option><option value="T" ${st==='T'?'selected':''}>Titular</option><option value="R" ${st==='R'?'selected':''}>Reserva</option></select></td>
      ${['min','gols','assist','ca','cv'].map(k=>`<td><input type="number" min="0" ${k==='min'?`max="${d+30}"`:k==='ca'?'max="2"':k==='cv'?'max="1"':''} data-f="${k}" value="${r?esc(r[k]??''):''}" ${r?'':'disabled'} aria-label="${k} ${esc(a.nome)}"></td>`).join('')}

  } else {

    body=`<div class="esc-wrap"><div><div style="display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap"><label class="f" style="flex-direction:row;align-items:center;gap:8px"><span style="font-weight:700;font-size:12px;color:var(--ink2)">FORMAÇÃO</span><select id="jForm" style="border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--card2)">${Object.keys(FORMACOES).map(f=>`<option ${f===EJ.formacao?'selected':''}>${f}</option>`).join('')}</select></label><button class="btn sm" data-act="autoEsc">Posicionar automaticamente</button><button class="btn sm" data-act="clrEsc">Limpar campo</button></div>
     <div style="background:#0f3d22;padding:2px;border-radius:6px">${pitch(EJ,true,EJslot)}</div></div>
     <div><b style="font-family:var(--fc);font-size:18px">TITULARES (${tit.length})</b><p class="muted" style="font-size:12.5px;margin:4px 0 10px">${EJslot>=0?'Agora toque no atleta para colocar na posição selecionada.':'Toque numa posição do campo e depois no atleta.'}</p>
     ${tit.length?`<div class="bench">${tit.map(a=>`<button data-pick="${a.id}" class="${EJ.escalacao.includes(a.id)?'used':''}"><img class="ava" src="${fotoDe(a)}" alt=""><span class="ptag" style="background:${PC2[a.posicao]};min-width:0">${a.posicao}</span>${esc(a.nome)}</button>`).join('')}</div>`:'<div class="empty" style="padding:20px">Marque os titulares na aba <b>Relacionados</b> primeiro.</div>'}</div></div>`;
  }
  $('#ejBody').innerHTML=tabs+body;
  bindEJ();

function bindEJ(){
  document.querySelectorAll('[data-ejtab]').forEach(b=>b.onclick=()=>{syncEJ();EJtab=b.dataset.ejtab;renderEJ();});
  const lg=$('#jLogo');if(lg)lg.onchange=async e=>{const f=e.target.files[0];if(!f)return;EJ.logoAdv=await resizeImage(f,120,120,'image/png');syncEJ();renderEJ();};
  const lr=$('#jLogoRm');if(lr)lr.onclick=()=>{EJ.logoAdv='';syncEJ();renderEJ();};
  const adv=$('#jAdv');if(adv)adv.oninput=()=>{if(!EJ.logoAdv){const prev=S.jogos.find(j=>j.adversario===adv.value.trim()&&j.logoAdv);$('#jLogoPrev').src=prev?prev.logoAdv:shieldSVG(adv.value);}};
  const gp=$('#jGPh');if(gp){const sg=EJ.relacionados.reduce((t,r)=>t+(+r.gols||0),0);if(sg)gp.textContent=sg+' gol(s) lançados nos atletas';}
  document.querySelectorAll('.reltbl tr[data-aid]').forEach(tr=>{const aid=tr.dataset.aid;
    tr.querySelectorAll('[data-f]').forEach(el=>{el.onchange=el.oninput=e=>{const f=el.dataset.f;
      if(f==='status'){const v=el.value;let r=EJ.relacionados.find(x=>x.atletaId===aid);
        if(!v){EJ.relacionados=EJ.relacionados.filter(x=>x.atletaId!==aid);EJ.escalacao=EJ.escalacao.map(x=>x===aid?null:x);}
        else if(r){r.status=v;if(v==='R')EJ.escalacao=EJ.escalacao.map(x=>x===aid?null:x);}
        else{const d=Number(EJ.duracao)||S.config.duracao?.[EJ.categoria]||90;EJ.relacionados.push({atletaId:aid,status:v,min:v==='T'?d:0,gols:0,assist:0,ca:0,cv:0});delete EJ.motivos[aid];}
        if(e.type==='change')renderEJ();return;}
      if(f==='motivo'){EJ.motivos[aid]=el.value;return;}
      const r=EJ.relacionados.find(x=>x.atletaId===aid);if(r)r[f]=el.value===''?0:Number(el.value);};});});
  document.querySelectorAll('[data-slot]').forEach(s=>{const fn=()=>{const i=+s.dataset.slot;if(EJslot===i){EJ.escalacao[i]=null;EJslot=-1;}else EJslot=i;renderEJ();};s.onclick=fn;s.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn();}};});
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const id=b.dataset.pick;let i=EJslot;
    if(i<0){const f=FORMACOES[EJ.formacao];const a=S.atletas.find(x=>x.id===id);i=f.findIndex((s,k)=>!EJ.escalacao[k]&&s[2]===a.posicao);if(i<0)i=f.findIndex((s,k)=>!EJ.escalacao[k]);if(i<0)return;}
    EJ.escalacao=EJ.escalacao.map(x=>x===id?null:x);EJ.escalacao[i]=id;EJslot=-1;renderEJ();});
  const jf=$('#jForm');if(jf)jf.onchange=()=>{EJ.formacao=jf.value;autoEsc(true);renderEJ();};
}
function computeEsc(formacao,relacionados){
  const f=FORMACOES[formacao]||FORMACOES['4-2-3-1'];const tit=relacionados.filter(r=>r.status==='T').map(r=>S.atletas.find(a=>a.id===r.atletaId)).filter(Boolean);
  const out=Array(11).fill(null);const used=new Set();
  f.forEach((s,i)=>{const a=tit.find(t=>!used.has(t.id)&&t.posicao===s[2]);if(a){out[i]=a.id;used.add(a.id);}});
  const near={LAT:['ZAG','VOL'],ZAG:['VOL','LAT'],VOL:['MEI','ZAG'],MEI:['VOL','EXT','ATA'],EXT:['MEI','ATA'],ATA:['EXT','MEI'],GOL:[]};
  f.forEach((s,i)=>{if(out[i])return;const a=tit.find(t=>!used.has(t.id)&&(near[s[2]]||[]).includes(t.posicao))||tit.find(t=>!used.has(t.id));if(a){out[i]=a.id;used.add(a.id);}});
  return out;
}
function autoEsc(){EJ.escalacao=computeEsc(EJ.formacao,EJ.relacionados);}
async function saveEJ(){
  syncEJ();const msg=$('#ejMsg');
  if(!EJ.adversario){EJtab='dados';renderEJ();msg.textContent='Informe o adversário.';return;}
  if(!EJ.data){EJtab='dados';renderEJ();msg.textContent='Informe a data do jogo.';return;}
  if(EJ.golsPro!==''&&EJ.golsPro!=null)EJ.golsPro=Number(EJ.golsPro);if(EJ.golsContra!==''&&EJ.golsContra!=null)EJ.golsContra=Number(EJ.golsContra);
  if(EJ.relacionados.some(r=>r.status==='T')&&!EJ.escalacao.some(Boolean))autoEsc();
  const o={...EJ};delete o._isNew;
  $('#ejSave').disabled=true;
  try{await Store.put('jogos',o);S.jogoSel=o.id;closeModal();render();toast('Jogo salvo');}catch(e){$('#ejSave').disabled=false;}
}

/* ================= RELATÓRIO INDIVIDUAL DO ATLETA ================= */
function viewAtleta(aid){
  const jogos=jogosFiltrados(),ats=atletasCat();
  let id=aid||S.atlSel;let a=ats.find(x=>x.id===id);if(!a){a=ats.slice().sort((x,y)=>x.nome.localeCompare(y.nome))[0];if(!aid&&a)S.atlSel=a.id;}
  const c=calc(jogos,ats);
  const h=header({sub:'RELATÓRIO DE MINUTAGEM — INDIVIDUAL',title:'RELATÓRIO INDIVIDUAL',meta:'icons',sloganBar:true,items:[[IC.trophy,'Competição',compLabel()],[IC.kCalPlus,'Período',periodo(jogos)],[IC.ballF,'Total de jogos',String(c.nJ)]]});
  const sel=PDFMODE?'':`<div class="pos-tabs no-print" style="align-items:center"><label for="selAtl" style="font-weight:700;font-size:13px;color:var(--ink2)">ATLETA</label><select id="selAtl" class="search" style="min-width:260px">${ats.slice().sort((x,y)=>POS.indexOf(x.posicao)-POS.indexOf(y.posicao)||x.nome.localeCompare(y.nome)).map(x=>`<option value="${x.id}" ${a&&x.id===a.id?'selected':''}>${esc(x.nome)} · ${POSN[x.posicao]}</option>`).join('')}</select></div>`;
  if(!a)return `<div class="report">${h}<div class="rbody">${emptyReport('Nenhum atleta cadastrado nesta categoria')}</div></div>`;

async function saveFile(filename,data){

  catch(e){if(e&&e.code==='declined')return false;if(e&&e.code==='rate_limited'){toast('Aguarde a janela de download anterior.');return false;}}

function fitPage(el){
  if(el.classList.contains('tall'))return;
  const fit=el.querySelector('.pg-fit');if(!fit)return;fit.style.transform='';fit.style.width='100%';
  const avail=el.clientHeight-20;let h=fit.scrollHeight;if(h<=avail)return;
  let s=avail/h;for(let k=0;k<4;k++){fit.style.width=(100/s)+'%';h=fit.scrollHeight;const ns=avail/h;if(ns>=s*0.995&&ns<=s*1.005)break;s=Math.min(1,ns);}
  s=Math.min(1,avail/fit.scrollHeight);fit.style.width=(100/s)+'%';fit.style.transformOrigin='top left';fit.style.transform=`scale(${s})`;
}
