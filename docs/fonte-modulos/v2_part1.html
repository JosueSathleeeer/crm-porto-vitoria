<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Porto Vitória · Fisioterapia / DM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700&family=Barlow:wght@400;500;600;700&family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
<script>try{const th=localStorage.getItem('pv_theme');if(th)document.documentElement.dataset.theme=th;}catch(e){}</script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --g900:#062a17; --g800:#0a3a20; --g700:#0e4a29; --g600:#146b39; --g500:#1b8a4a; --g400:#3fae68; --g300:#7bd08f;
  --gold:#f2b81b;
  --bg:#eef2ef; --card:#ffffff; --card2:#f6f8f7; --line:#dfe6e2; --ink:#14201a; --ink2:#4b5a52; --ink3:#7d8b84;
  --row:#f7faf8; --shadow:0 1px 2px rgba(10,40,25,.08),0 4px 14px rgba(10,40,25,.06);
  --red:#e0342b; --yellow:#f6c21c; --orange:#f39324; --blue:#2f6fd6; --purple:#7a3fd1; --pink:#ec3f93; --teal:#159aa8;
  --trk:#e9eeeb; --kic:var(--g800); --redbg:#fde6e4; --yelbg:#fdf3cf; --grnbg:#e1f3e7; --blubg:#e3ecfb;
  --fc:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --fb:'Barlow','Segoe UI',Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1410; --card:#141e19; --card2:#1a2620; --line:#26352d; --ink:#e7efe9; --ink2:#a9b8af; --ink3:#7f9087; --row:#17221c;
    --shadow:0 1px 2px rgba(0,0,0,.4); --trk:#24322a; --kic:var(--g300);
    --redbg:#3a1714; --yelbg:#352c0c; --grnbg:#123222; --blubg:#14233d;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1410; --card:#141e19; --card2:#1a2620; --line:#26352d; --ink:#e7efe9; --ink2:#a9b8af; --ink3:#7f9087; --row:#17221c;
  --shadow:0 1px 2px rgba(0,0,0,.4); --trk:#24322a; --kic:var(--g300);
  --redbg:#3a1714; --yelbg:#352c0c; --grnbg:#123222; --blubg:#14233d;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:14px;-webkit-font-smoothing:antialiased}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
a{color:var(--g500)}

/* ---------- App shell (igual à Minutagem) ---------- */
.app{display:flex;height:100%}
.side{width:68px;flex:0 0 68px;background:linear-gradient(180deg,var(--g800),var(--g900));display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;position:relative;z-index:30}
.side .brand{width:46px;height:46px;margin-bottom:14px}
.side .brand img{width:100%;height:100%;object-fit:contain}
.nav-item{position:relative;width:100%;display:flex;justify-content:center}
.nav-btn{width:46px;height:46px;border-radius:12px;border:0;background:transparent;color:#cfe6d6;display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s}
.nav-btn svg{width:22px;height:22px}
.nav-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-btn.active{background:var(--g500);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav-fly{position:absolute;left:58px;top:0;background:var(--g800);color:#fff;border-radius:10px;padding:6px;min-width:190px;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;visibility:hidden;transform:translateX(-6px);transition:opacity .12s,transform .12s,visibility .12s}
.nav-fly::before{content:"";position:absolute;left:-14px;top:0;width:14px;height:100%}
.nav-item:hover .nav-fly,.nav-item:focus-within .nav-fly{opacity:1;visibility:visible;transform:none}
.nav-fly .fly-title{font-family:var(--fc);font-weight:700;font-size:15px;letter-spacing:.3px;padding:6px 10px 4px;color:var(--gold);text-transform:uppercase}
.nav-fly button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;color:#e6f2ea;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13.5px}
.nav-fly button:hover{background:rgba(255,255,255,.1)}
.nav-fly button.active{background:var(--g500)}
.side .spacer{flex:1}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar .crumb{font-family:var(--fc);font-weight:700;font-size:19px;color:var(--ink);margin-right:auto;text-transform:uppercase;letter-spacing:.3px}
.topbar .crumb small{font-weight:600;color:var(--ink3);font-size:15px}
.flt{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:4px 4px 4px 10px}
.flt label{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.4px}
.flt select{border:0;background:transparent;font-weight:600;padding:5px 4px;cursor:pointer;max-width:170px}
.flt select option{color:#111;background:#fff}
.sync{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:#aaa;display:inline-block}
.sync.ok i{background:var(--g400)}
.content{flex:1;overflow:auto;padding:16px 18px 30px;container:rep/inline-size}

.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:9px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--g400)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--g600);border-color:var(--g600);color:#fff}
.btn.pri:hover{background:var(--g500)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1d1a05}
.btn.danger{color:var(--red)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn svg{width:16px;height:16px}
.icon-btn{border:0;background:transparent;cursor:pointer;padding:6px;border-radius:7px;color:var(--ink2)}
.icon-btn:hover{background:var(--card2);color:var(--ink)}
.icon-btn svg{width:17px;height:17px}

/* ---------- Cabeçalho de relatório ---------- */
.report{max-width:1560px;margin:0 auto}
.rhead{position:relative;display:flex;align-items:center;gap:18px;background:linear-gradient(100deg,var(--g800) 0%,var(--g700) 45%,#0c3f23 100%);color:#fff;border-radius:12px 12px 0 0;padding:14px 22px;min-height:104px;overflow:hidden}
.rhead::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 9px);pointer-events:none}
.rhead .lt{white-space:nowrap;flex:0 0 auto}
.rhead .logo{width:78px;height:84px;flex:0 0 auto;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.rhead .t1{font-family:var(--fc);font-weight:800;font-size:38px;line-height:1;letter-spacing:.3px}
.rhead .t2{font-family:var(--fc);font-weight:700;font-size:19px;line-height:1.15;margin-top:4px}
.rhead .t3{font-family:var(--fc);font-weight:500;font-size:17px;letter-spacing:.4px;line-height:1.2;opacity:.95}
.rhead .center{flex:1;text-align:center}
.rhead .bigtitle{font-family:var(--fc);font-weight:800;font-size:clamp(26px,2.5vw,42px);line-height:1;letter-spacing:.5px;white-space:nowrap}
.rhead .pill{display:inline-block;background:var(--g500);border-radius:8px;padding:2px 14px;font-family:var(--fc);font-weight:800;font-size:20px;margin-top:5px}
.rhead .meta{display:flex;align-items:center;background:#fff;color:var(--g900);border-radius:12px 0 0 12px;margin-right:-22px;padding:10px 18px 10px 26px;clip-path:polygon(22px 0,100% 0,100% 100%,0 100%)}
.rhead .meta .mi{display:flex;align-items:center;gap:9px;padding:0 16px;border-left:1px solid #d3ddd7}
.rhead .meta .mi:first-child{border-left:0}
.rhead .meta .mi svg{width:30px;height:30px;color:var(--g800)}
.rhead .meta small{display:block;font-size:10.5px;font-weight:600;color:#3d4d44;text-transform:uppercase}
.rhead .meta b{display:block;font-family:var(--fc);font-weight:800;font-size:19px;line-height:1.05;text-transform:uppercase}
.rhead .slogan{font-family:var(--fc);font-weight:700;font-style:italic;font-size:19px;line-height:1.1;color:var(--g300);text-transform:uppercase;letter-spacing:.6px;padding-left:22px}
.rhead > *{position:relative;z-index:1}
.rtabs{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:0 10px;overflow-x:auto;margin-bottom:16px;box-shadow:var(--shadow)}
.rtabs button{border:0;background:transparent;padding:11px 14px;font-weight:700;color:var(--ink2);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-size:14px}
.rtabs button.on{color:var(--g600);border-bottom-color:var(--g500)}
:root[data-theme="dark"] .rtabs button.on{color:var(--g300)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rtabs button.on{color:var(--g300)}}
.rbody{padding:0}
.rhead.solo{border-radius:12px;margin-bottom:16px}

.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;gap:14px;align-items:flex-start;box-shadow:var(--shadow);min-width:0}
.kpi svg{width:44px;height:44px;flex:0 0 44px;color:var(--kic)}
.kpi.red svg{color:var(--red)}.kpi.gold svg{color:var(--orange)}.kpi.blue svg{color:var(--blue)}
.kpi .k{font-family:var(--fc);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.2px;line-height:1.1}
.kpi .v{font-family:var(--fc);font-weight:800;font-size:31px;line-height:1.05;margin-top:2px}
.kpi .v.txt{font-size:23px;line-height:1.15}
.kpi .v small{font-size:17px;font-weight:700;margin-left:3px}
.kpi .s{color:var(--ink2);font-size:13.5px}
.up{color:var(--red);font-weight:700}.down{color:var(--g500);font-weight:700}

.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.ph{background:linear-gradient(90deg,var(--g800),var(--g700));color:#fff;font-family:var(--fc);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.3px;padding:6px 18px;display:flex;align-items:center;gap:10px}
.ph .r{margin-left:auto;font-size:14px;font-weight:600;opacity:.95}
.ph .r button,.ph .r a{color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:7px;padding:2px 10px;font:600 13px var(--fb);cursor:pointer;text-transform:none;text-decoration:none}
.pb{padding:14px 18px}
.pb.np{padding:0}
.row{display:grid;gap:14px;margin-bottom:16px}
.r4{grid-template-columns:1.3fr 1fr 1fr 1fr}
.r3{grid-template-columns:repeat(3,minmax(0,1fr))}
.r2{grid-template-columns:1fr 1fr}
.r21{grid-template-columns:2.3fr 1fr}
.r12{grid-template-columns:1fr 1.6fr}

/* barras horizontais */
.dist{display:grid;grid-template-columns:minmax(90px,auto) 1fr auto auto;gap:9px 14px;align-items:center}
.dist .nm{font-size:14.5px;display:flex;align-items:center;gap:8px}
.track{height:14px;background:var(--trk);border-radius:3px;overflow:hidden}
.track>i{display:block;height:100%;background:linear-gradient(90deg,var(--g600),var(--g500));border-radius:3px}
.dist .vv{font-family:var(--fc);font-weight:800;font-size:17px;text-align:right}
.dist .pp{color:var(--ink2);font-size:13.5px;text-align:right;min-width:46px}

/* donut + legenda */
.donut-wrap{display:flex;align-items:center;gap:18px;justify-content:center;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:12px}
.legend .li{display:flex;gap:10px;align-items:flex-start}
.legend .sw{width:16px;height:22px;border-radius:2px;flex:0 0 16px;margin-top:2px}
.legend b{font-family:var(--fc);font-weight:700;font-size:17px;display:block;line-height:1.1}
.legend span{color:var(--ink2);font-size:14px}
.chart{width:100%;height:auto;display:block}
svg text{font-family:var(--fb)}

/* tabelas (padrão Minutagem) */
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.t th{background:var(--g800);color:#fff;font-family:var(--fc);font-weight:700;font-size:14px;text-transform:uppercase;padding:7px 8px;white-space:nowrap;border-right:1px solid rgba(255,255,255,.18)}
table.t th:last-child{border-right:0}
table.t td{padding:6px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;white-space:nowrap}
table.t td:last-child{border-right:0}
table.t tbody tr:nth-child(even) td{background:var(--row)}
table.t td.l,table.t th.l{text-align:left}
table.t tfoot td{font-family:var(--fc);font-weight:800;font-size:15px;background:var(--card2)}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--grnbg)}
table.t tr.rowsel td{background:var(--grnbg)!important;box-shadow:inset 0 1px 0 var(--g400),inset 0 -1px 0 var(--g400)}
.athcell{display:flex;align-items:center;gap:10px;text-align:left}
.athcell b{font-weight:600;display:block;line-height:1.15}
.athcell small{color:var(--ink2);font-size:11.5px}
.ava{width:30px;height:30px;border-radius:50%;flex:0 0 30px;display:grid;place-items:center;background:linear-gradient(145deg,var(--g600),var(--g900));color:#fff;font:800 13px var(--fc);letter-spacing:.4px;overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover;object-position:center top}
.ava.lg{width:120px;height:140px;flex:0 0 120px;border-radius:10px;font-size:44px;background:radial-gradient(ellipse at 50% 30%,#2a2f2c,#111513)}
.ava.lg img{object-fit:contain;object-position:center bottom}
.ptag{display:inline-block;min-width:38px;padding:2px 6px;border-radius:3px;color:#fff;font-weight:700;font-family:var(--fc);font-size:13px;letter-spacing:.3px;text-align:center}
.subtag{display:inline-block;font-size:10.5px;font-weight:700;background:#e2eee6;color:#145c33;border:1px solid #b9d8c3;border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:middle;line-height:15px}
.st{display:inline-block;padding:3px 10px;border-radius:5px;font-size:12.5px;font-weight:700;white-space:nowrap;font-family:var(--fb)}
.st-tratamento{background:var(--redbg);color:var(--red)}
.st-transicao{background:var(--yelbg);color:#b07a00}
.st-retorno{background:var(--grnbg);color:var(--g500)}
.st-liberado{background:var(--blubg);color:var(--blue)}
.st-ok{background:var(--grnbg);color:var(--g500)}
:root[data-theme="dark"] .st-transicao{color:var(--yellow)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .st-transicao{color:var(--yellow)}}
.sq{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:6px}

/* mapa corporal (imagem anatômica) */
.bodymap{width:100%;max-width:560px;display:block;margin:0 auto;height:auto}
.bodymap .zone{fill:transparent;stroke:none;transition:fill .15s}
.bodymap .zone:hover{fill:rgba(242,184,27,.38)}
.bodymap .zone.heat:hover{filter:brightness(1.15)}
.bodymap.pick .zone{cursor:pointer}
.bodymap.pick .zone:hover{fill:rgba(242,184,27,.55)}
.bodymap .zone.sel,.bodymap.pick .zone.sel:hover{fill:rgba(224,52,43,.78)}
.bodymap .zone:focus-visible{outline:none;fill:rgba(242,184,27,.6)}
.bodymap .zone.hl{fill:rgba(224,52,43,.72)}
.bodymap .lbl{font:800 22px var(--fc);fill:var(--ink2);text-anchor:middle;letter-spacing:1px}
.bodymap .side-l{font:800 26px var(--fc);fill:var(--g500);text-anchor:middle}
.heatbar{display:flex;align-items:center;gap:8px;justify-content:center;font-size:12px;color:var(--ink2);margin-top:6px}
.heatbar i{display:block;width:140px;height:10px;border-radius:5px;background:linear-gradient(90deg,hsl(48,90%,55%),hsl(24,90%,52%),hsl(0,85%,48%))}
#tip{position:fixed;pointer-events:none;background:var(--g900);color:#fff;padding:6px 10px;border-radius:7px;font-size:12.5px;font-weight:600;z-index:300;opacity:0;transition:opacity .1s;max-width:240px;box-shadow:0 6px 18px rgba(0,0,0,.3)}

/* páginas de gestão */
.page-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.page-h h2{font-family:var(--fc);font-weight:800;font-size:28px;margin:0;text-transform:uppercase}
.page-h .sp{flex:1}
.search{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 12px;min-width:220px}
.athgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.athc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
.athc .ava{width:58px;height:68px;flex:0 0 58px;border-radius:6px;font-size:22px;background:radial-gradient(ellipse at 50% 30%,#2a2f2c,#111513)}
.athc .ava img{object-fit:contain;object-position:center bottom}
.athc .i{flex:1;min-width:0}
.athc .i b{display:block;font-family:var(--fc);font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.athc .i span{display:block;font-size:12.5px;color:var(--ink2)}
.athc .i span.subtag,.athc .i span.st{display:inline-block;width:auto}
.athc .i span.st{font-size:11.5px;padding:2px 8px}
.athc .acts{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.athc .acts div{display:flex}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:34px 20px;text-align:center;color:var(--ink2)}
.empty h3{font-family:var(--fc);font-size:24px;color:var(--ink);margin:0 0 6px}
.empty .acts{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.mini-empty{padding:22px 10px;text-align:center;color:var(--ink2)}
.muted{color:var(--ink2)}
.warn{background:#fff6dc;border:1px solid #f1d27a;color:#6a5208;border-radius:8px;padding:8px 12px;font-size:13px;margin:8px 0}
.fbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--card2)}
.fbar .f{min-width:150px;flex:1}
.pos-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;display:inline-flex;gap:7px;align-items:center}
.chip.on{background:var(--g700);color:#fff;border-color:var(--g700)}

/* detalhe da lesão */
.det-sec{margin-bottom:12px}
.det-sec h4{font-family:var(--fc);font-weight:800;font-size:16px;text-transform:uppercase;margin:0 0 6px;color:var(--g600);letter-spacing:.3px}
:root[data-theme="dark"] .det-sec h4{color:var(--g300)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .det-sec h4{color:var(--g300)}}
.det-row{display:grid;grid-template-columns:128px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.det-row:last-child{border:0}
.det-row span{color:var(--ink2)}
.det-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.det-head b{font-family:var(--fc);font-weight:800;font-size:22px;text-transform:uppercase;display:block;line-height:1.05}
.steps{display:grid;grid-template-columns:repeat(5,1fr);position:relative;margin:10px 0 4px}
.steps::before{content:"";position:absolute;left:10%;right:10%;top:12px;height:3px;background:var(--line)}
.steps .s{position:relative;text-align:center;font-size:11.5px;color:var(--ink2)}
.steps .s i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;margin:0 auto 5px;background:var(--card2);border:3px solid var(--line);font-style:normal;font-size:12px;font-weight:800;color:#fff}
.steps .s.done i{background:var(--g500);border-color:var(--g500)}
.steps .s.cur i{background:var(--gold);border-color:var(--gold);color:#1d1a05}
.steps .s b{display:block;color:var(--ink);font-family:var(--fc);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:-.1px;padding:0 2px}

/* ficha do atleta (histórico) */
.ind-top{display:grid;grid-template-columns:340px 1fr;gap:14px;margin-bottom:16px}
.bio{display:flex;gap:14px;align-items:center;padding:14px 16px}
.bio h3{font-family:var(--fc);font-weight:800;font-size:26px;text-transform:uppercase;margin:4px 0;line-height:1.05}
.bio2{padding:0 16px 12px}
.bio2>div{display:flex;justify-content:space-between;padding:6px 2px;border-bottom:1px solid var(--line);font-size:14px}
.bio2>div:last-child{border:0}
.bio2 b{font-family:var(--fc);font-weight:800;font-size:17px}
.hist-item+.hist-item{border-top:1px solid var(--line)}
.hist-h{display:grid;grid-template-columns:76px 1.4fr .9fr .6fr 1.2fr .9fr auto 26px;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;background:transparent;border:0;width:100%;text-align:left}
.hist-h:hover{background:var(--card2)}
.hist-h .ic{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:var(--card2);color:var(--red)}
.hist-h .ic.ok{color:var(--ink3)}
.hist-h .ic svg{width:24px;height:24px}
.hist-h b{display:block;font-family:var(--fc);font-weight:700;font-size:16.5px;line-height:1.1}
.hist-h small{color:var(--ink2);display:block;font-size:12.5px}
.hist-b{display:none;grid-template-columns:repeat(4,1fr);gap:16px;margin:0 14px 14px;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--card2);font-size:13.5px}
.hist-item.open .hist-b{display:grid}
.hist-b h5{margin:0 0 4px;font:700 13px var(--fc);text-transform:uppercase;color:var(--ink2);letter-spacing:.3px}
.hist-b p{margin:0 0 8px}
.hist-item .chev{transition:transform .2s;color:var(--ink2)}
.hist-item .chev svg{width:18px;height:18px}
.hist-item.open .chev{transform:rotate(180deg)}
.mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini-stats div{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.mini-stats span{font-size:12px;color:var(--ink2);display:block}
.mini-stats b{font-family:var(--fc);font-weight:800;font-size:22px;color:var(--g600)}
:root[data-theme="dark"] .mini-stats b{color:var(--g300)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mini-stats b{color:var(--g300)}}

/* modal + formulários (padrão Minutagem) */
.modal-bg{position:fixed;inset:0;background:rgba(5,20,12,.55);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) 14px 20px;overflow:auto}
.modal-bg.open{display:flex}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:760px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.modal.xl{max-width:1180px}
.modal .mh{background:linear-gradient(90deg,var(--g800),var(--g700));color:#fff;padding:12px 18px;display:flex;align-items:center;gap:10px}
.modal .mh h3{margin:0;font-family:var(--fc);font-weight:800;font-size:22px;text-transform:uppercase;flex:1}
.modal .mh .icon-btn{color:#fff}
.modal .mb{padding:18px;display:flex;flex-direction:column;gap:14px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.modal .mf .msg{margin-right:auto;font-size:13px;color:var(--red);font-weight:600}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 14px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.s2{grid-column:span 2}.f.s4{grid-column:1/-1}
.f label,.f>span{font-size:11.5px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.3px}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--card2);border-radius:8px;padding:8px 10px;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--g400);outline:none;box-shadow:0 0 0 3px rgba(63,174,104,.2)}
.f textarea{resize:vertical;min-height:64px}
.f .hint,.hint{font-size:12px;color:var(--g600);font-weight:600}
.hint.warn2{color:#b07a00}
.fsec{font-family:var(--fc);font-weight:800;font-size:17px;text-transform:uppercase;color:var(--g600);display:flex;align-items:center;gap:10px;letter-spacing:.3px}
.fsec::after{content:"";flex:1;height:2px;background:var(--line)}
:root[data-theme="dark"] .fsec{color:var(--g300)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fsec{color:var(--g300)}}
.split{display:grid;grid-template-columns:minmax(300px,1.1fr) 1fr;gap:18px}
.mappick{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card2)}
.mappick .picked{text-align:center;margin-top:4px;font-family:var(--fc);font-weight:800;font-size:19px;text-transform:uppercase}
.mappick .picked span{color:var(--ink2);font-weight:600}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card2)}
.seg2 label{padding:8px 14px;cursor:pointer;font-weight:700;font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink)}
.seg2 input{position:absolute;opacity:0;pointer-events:none}
.seg2 label:has(input:checked){background:var(--g600);color:#fff}
.seg2 label:has(input:disabled){opacity:.4;cursor:not-allowed}
.seg2 label:has(input:focus-visible),.tchips label:has(input:focus-visible){outline:3px solid var(--gold)}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchips label{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;user-select:none;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink)}
.tchips input{position:absolute;opacity:0;pointer-events:none}
.tchips label:has(input:checked){background:var(--g700);border-color:var(--g700);color:#fff}
.eva{display:flex;align-items:center;gap:12px}
.eva input{flex:1;accent-color:var(--red)}
.eva b{font:800 26px var(--fc);min-width:40px;text-align:center}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--g500)}

/* configurações */
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.taglist{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.taglist span{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;display:inline-flex;align-items:center;gap:4px}
.taglist span button{border:0;background:transparent;cursor:pointer;color:var(--ink3);font-size:16px;line-height:1}
.row-add{display:flex;gap:8px}
.row-add input{flex:1;border:1px solid var(--line);background:var(--card2);border-radius:8px;padding:8px 10px}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.themes button{border:2px solid var(--line);border-radius:10px;background:var(--card2);padding:10px;cursor:pointer;font-weight:700;display:flex;flex-direction:column;gap:8px;align-items:center}
.themes button.on{border-color:var(--g500);box-shadow:0 0 0 3px rgba(63,174,104,.2)}
.themes .pv{width:100%;height:46px;border-radius:6px;display:flex;overflow:hidden;border:1px solid var(--line)}
.themes .pv i{display:block}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(12px);background:var(--g800);color:#fff;padding:10px 18px;border-radius:10px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.3);font-weight:600;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translateX(-50%)}
.legend-status{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);align-items:center}

.rfoot{display:flex;align-items:center;gap:16px;padding:14px 4px 4px;color:var(--ink2);font-size:12px;flex-wrap:wrap}
.rfoot img{width:40px;height:44px;object-fit:contain}
.rfoot .club b{display:block;font-family:var(--fc);font-weight:700;font-size:16px;color:var(--ink)}
.rfoot .club span{font-family:var(--fc);font-size:14px;color:var(--ink)}
.rfoot .leg{flex:1;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:flex-end}
.loading{padding:60px;text-align:center;color:var(--ink2)}

  .app{flex-direction:column}

}

.thumb{width:66px;height:66px;flex:0 0 66px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#2c3a32,#0d1611);border:2px solid var(--line);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}

.signs span{font-size:12px;color:var(--ink2)}
#pdfHolder{position:fixed;left:0;top:0;z-index:140;width:1280px;pointer-events:none}
#pdfProg{position:fixed;inset:0;z-index:160;background:rgba(5,20,12,.82);display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px}
#pdfProg div{display:flex;align-items:center;gap:12px;background:var(--g800);padding:16px 22px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.spin{width:20px;height:20px;border:3px solid rgba(255,255,255,.3);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sheet{width:1280px;height:720px;overflow:hidden;position:relative;background:#eef2ef}
.sheet>.pdfpage{position:absolute;left:0;top:0;transform-origin:0 0}
.sheet.zm{display:flex;align-items:center;justify-content:center}
.sheet.zm>.pdfpage{position:static;flex:none}
#printRoot .sheet *{break-inside:auto!important;break-before:auto!important;break-after:auto!important}
.pdfpage.fixed{display:flex;flex-direction:column}
.pdfpage.fixed>.report{flex:1;display:flex;flex-direction:column;width:100%}
.pdfpage.fixed .report>.row,.pdfpage.fixed .report>.ind-top,.pdfpage.fixed .report>.grow{flex:1 1 auto}
.pdfpage.fixed .report>.row>.panel,.pdfpage.fixed .grow>.panel,.pdfpage.fixed .ind-top>.panel{display:flex;flex-direction:column}
.pdfpage.fixed .report>.row>.panel>.pb,.pdfpage.fixed .grow>.panel>.pb{flex:1;display:flex;flex-direction:column;justify-content:center}
.pdfpage.fixed .grow>.panel{height:100%}
.pdfpage.fixed .pb.np{justify-content:flex-start!important}
.pdfpage.fixed .chart{height:270px;width:100%;flex:none}
.pdfpage.fixed .bodymap{height:430px;width:auto;max-width:100%;flex:none;align-self:center}
.pdfpage.fixed .report>.row,.pdfpage.fixed .report>.ind-top,.pdfpage.fixed .report>.grow{flex-shrink:0}
.pdfpage.fixed .rfoot{margin-top:auto}
.thumb.sm{width:44px;height:44px;flex-basis:44px}
@media screen{#printRoot{position:fixed;left:-30000px;top:0}}
@media print{
  @page{size:13.333in 7.5in;margin:0}
  body.printing .app,body.printing .modal-bg,body.printing .toast,body.printing #tip{display:none!important}
  body.printing{height:auto!important;background:#fff}
  html,body{height:auto}
  #printRoot{position:static}
  #printRoot .sheet{break-after:page;page-break-after:always}
  #printRoot .sheet:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body:not(.printing) .side,body:not(.printing) .topbar{display:none}
  body:not(.printing) .content{overflow:visible}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side" aria-label="Menu principal"></nav>
  <div class="main">
    <div class="topbar" id="topbar"></div>
    <div class="content" id="content"><div class="loading">Carregando dados…</div></div>
  </div>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div id="tip"></div>
<div class="toast" id="toast"></div>
